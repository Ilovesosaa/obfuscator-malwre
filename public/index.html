<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIN Obfuscator v5.0 | Advanced Roblox Script Protection</title>
    <!-- Google Fonts & Lucide Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-base: #09090b;
            --bg-surface: #121216;
            --bg-card: #18181b;
            --border: #27272a;
            --border-focus: #ef4444;
            --primary: #ef4444;
            --primary-hover: #dc2626;
            --primary-glow: rgba(239, 68, 68, 0.15);
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --accent-green: #22c55e;
            --font-sans: 'Plus Jakarta Sans', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: var(--font-sans);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(239, 68, 68, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(18, 18, 22, 0.5) 0%, transparent 50%);
        }

        /* Top Navigation Bar */
        header {
            height: 70px;
            border-bottom: 1px solid var(--border);
            background: rgba(9, 9, 11, 0.8);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 2rem;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, #ef4444, #991b1b);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.2rem;
            color: white;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.3);
        }

        .logo-text {
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .badge {
            background: rgba(239, 68, 68, 0.1);
            color: var(--primary);
            border: 1px solid rgba(239, 68, 68, 0.2);
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            font-family: var(--font-sans);
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            border: none;
            text-decoration: none;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.25);
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(239, 68, 68, 0.35);
        }

        .btn-secondary {
            background-color: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background-color: var(--border);
            border-color: var(--text-muted);
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--bg-card);
            padding: 6px 12px 6px 6px;
            border-radius: 30px;
            border: 1px solid var(--border);
        }

        .user-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            object-fit: cover;
        }

        .user-name {
            font-size: 0.875rem;
            font-weight: 600;
        }

        /* Main Workspace Layout */
        main {
            max-width: 1280px;
            width: 100%;
            margin: 2rem auto;
            padding: 0 1.5rem;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .hero-title-area {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .hero-title-area h1 {
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .hero-title-area p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .workspace-card {
            background-color: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-label {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
        }

        .text-input {
            background: var(--bg-base);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-main);
            padding: 12px 16px;
            font-family: var(--font-sans);
            font-size: 0.95rem;
            transition: var(--transition);
            outline: none;
        }

        .text-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-glow);
        }

        /* Drag & Drop Upload Zone */
        .dropzone {
            border: 2px dashed var(--border);
            border-radius: var(--radius-md);
            background: var(--bg-base);
            padding: 2rem;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .dropzone:hover, .dropzone.dragover {
            border-color: var(--primary);
            background: rgba(239, 68, 68, 0.02);
        }

        .dropzone i {
            color: var(--text-muted);
            transition: var(--transition);
        }

        .dropzone:hover i {
            color: var(--primary);
        }

        .dropzone-text {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .dropzone-text span {
            color: var(--primary);
            font-weight: 600;
        }

        /* Code Editor Window Styling */
        .editor-container {
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            background: var(--bg-base);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .editor-header {
            background: var(--bg-card);
            padding: 10px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .editor-header-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .editor-dots {
            display: flex;
            gap: 6px;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .dot-red { background: #ef4444; }
        .dot-yellow { background: #f59e0b; }
        .dot-green { background: #22c55e; }

        .editor-body {
            position: relative;
            min-height: 320px;
            max-height: 500px;
            overflow-y: auto;
        }

        textarea.code-textarea {
            width: 100%;
            height: 350px;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-family: var(--font-mono);
            font-size: 0.875rem;
            line-height: 1.6;
            padding: 16px;
            resize: vertical;
            outline: none;
            tab-size: 4;
        }

        /* Action Footer */
        .workspace-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            padding-top: 0.5rem;
        }

        .char-counter {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-family: var(--font-mono);
        }

        .btn-obfuscate {
            padding: 14px 32px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: var(--radius-md);
            width: 100%;
            justify-content: center;
            letter-spacing: 0.3px;
        }

        /* Output Modal / Drawer Preview Style */
        .output-container {
            display: none;
            margin-top: 1.5rem;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 1.5rem;
            animation: fadeIn 0.3s ease forwards;
        }

        .output-container.active {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .output-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .output-title {
            font-weight: 700;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--accent-green);
        }

        .loader-box {
            background: var(--bg-base);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 12px 16px;
            font-family: var(--font-mono);
            font-size: 0.875rem;
            color: var(--text-main);
            word-break: break-all;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        /* Toast Notifications */
        #toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 12px 20px;
            border-radius: var(--radius-sm);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            font-size: 0.875rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .toast.success { border-left: 4px solid var(--accent-green); }
        .toast.error { border-left: 4px solid var(--primary); }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(50px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @media (max-width: 768px) {
            header { padding: 0 1rem; }
            main { padding: 1rem; margin: 1rem auto; }
            .workspace-footer { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body>

    <!-- Top Header -->
    <header>
        <div class="logo-container">
            <div class="logo-icon">S</div>
            <div class="logo-text">
                SIN OBFUSCATOR <span class="badge">v5.0</span>
            </div>
        </div>
        <div class="nav-actions" id="nav-actions">
            <!-- Dynamic Auth Rendered via JS -->
            <a href="/auth/discord" class="btn btn-secondary">
                <i data-lucide="discord" style="width: 18px; height: 18px;"></i>
                Login with Discord
            </a>
        </div>
    </header>

    <!-- Main Workspace -->
    <main>
        <div class="hero-title-area">
            <h1>Script Encryption Engine</h1>
            <p>Obfuscate .lua and .luau files into protected memory links instantly.</p>
        </div>

        <div class="workspace-card">
            <!-- Script Name Identifier -->
            <div class="input-group">
                <label class="input-label" for="scriptNameInput">Script Identifier</label>
                <input type="text" id="scriptNameInput" class="text-input" placeholder="e.g., Auto Heal GUI" autocomplete="off" />
            </div>

            <!-- Drag and Drop Zone -->
            <div class="dropzone" id="dropzone">
                <input type="file" id="fileInput" accept=".lua,.luau" style="display: none;" />
                <i data-lucide="folder-open" style="width: 32px; height: 32px;"></i>
                <div class="dropzone-text">Drag & drop your <span>.lua</span> or <span>.luau</span> file here, or <span>browse</span></div>
            </div>

            <!-- Code Editor Window -->
            <div class="editor-container">
                <div class="editor-header">
                    <div class="editor-header-left">
                        <div class="editor-dots">
                            <div class="dot dot-red"></div>
                            <div class="dot dot-yellow"></div>
                            <div class="dot dot-green"></div>
                        </div>
                        <span id="fileTypeIndicator" style="margin-left: 8px; font-family: var(--font-mono); color: var(--primary);">LUAU / LUA 5.1</span>
                    </div>
                    <button class="btn btn-secondary" style="padding: 2px 8px; font-size: 0.75rem;" id="clearEditorBtn">Clear Editor</button>
                </div>
                <div class="editor-body">
                    <textarea id="scriptInput" class="code-textarea" placeholder="-- Paste or drop your Roblox Luau script here..."></textarea>
                </div>
            </div>

            <!-- Footer & Submit Trigger -->
            <div class="workspace-footer">
                <div class="char-counter" id="charCounter">0 CHARS</div>
            </div>
            
            <button class="btn btn-primary btn-obfuscate" id="obfuscateBtn">
                <i data-lucide="shield-check" style="width: 20px; height: 20px;"></i>
                Obfuscate Script
            </button>
        </div>

        <!-- Output Result Panel -->
        <div class="output-container" id="outputContainer">
            <div class="output-header">
                <div class="output-title">
                    <i data-lucide="check-circle-2" style="width: 20px; height: 20px;"></i>
                    Protection Successful!
                </div>
            </div>
            <div class="input-group">
                <label class="input-label">Generated Roblox Loader (game:HttpGet)</label>
                <div class="loader-box">
                    <span id="loaderOutputText" style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;"></span>
                    <button class="btn btn-primary" id="copyLoaderBtn" style="padding: 6px 12px; font-size: 0.75rem; flex-shrink: 0;">
                        <i data-lucide="copy" style="width: 14px; height: 14px;"></i> Copy
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- Toast Notification Container -->
    <div id="toast-container"></div>

    <!-- Frontend UI Logic & Interactivity -->
    <script>
        // Initialize Lucide Icons
        lucide.createIcons();

        const scriptInput = document.getElementById('scriptInput');
        const scriptNameInput = document.getElementById('scriptNameInput');
        const fileInput = document.getElementById('fileInput');
        const dropzone = document.getElementById('dropzone');
        const clearEditorBtn = document.getElementById('clearEditorBtn');
        const charCounter = document.getElementById('charCounter');
        const obfuscateBtn = document.getElementById('obfuscateBtn');
        const outputContainer = document.getElementById('outputContainer');
        const loaderOutputText = document.getElementById('loaderOutputText');
        const copyLoaderBtn = document.getElementById('copyLoaderBtn');
        const navActions = document.getElementById('nav-actions');

        let generatedLoaderUrl = '';

        // Toast Notification System
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `
                <i data-lucide="${type === 'success' ? 'check-circle' : 'alert-circle'}" style="width: 18px; height: 18px; color: ${type === 'success' ? 'var(--accent-green)' : 'var(--primary);'}"></i>
                <span>${message}</span>
            `;
            container.appendChild(toast);
            lucide.createIcons();
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(50px)';
                toast.style.transition = 'all 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        // Live Character Counter & Type Badge Update
        scriptInput.addEventListener('input', () => {
            const len = scriptInput.value.length;
            charCounter.textContent = `${len} CHARS`;
        });

        // Clear Editor
        clearEditorBtn.addEventListener('click', () => {
            scriptInput.value = '';
            scriptNameInput.value = '';
            charCounter.textContent = '0 CHARS';
            outputContainer.classList.remove('active');
            showToast('Editor cleared.', 'success');
        });

        // Drag and Drop Handling
        dropzone.addEventListener('click', () => fileInput.click());
        dropzone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropzone.classList.add('dragover');
        });
        dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
        dropzone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropzone.classList.remove('dragover');
            if (e.dataTransfer.files.length) {
                handleFile(e.dataTransfer.files[0]);
            }
        });
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) {
                handleFile(e.target.files[0]);
            }
        });

        function handleFile(file) {
            const reader = new FileReader();
            reader.onload = function(evt) {
                scriptInput.value = evt.target.result;
                scriptNameInput.value = file.name.replace(/\.[^/.]+$/, "");
                charCounter.textContent = `${scriptInput.value.length} CHARS`;
                showToast(`Loaded ${file.name} successfully!`, 'success');
            };
            reader.readAsText(file);
        }

        // Fetch User Auth State on Load
        async function checkAuth() {
            try {
                const res = await fetch('/api/me');
                const data = await res.json();
                if (data.authenticated) {
                    navActions.innerHTML = `
                        <div class="user-profile">
                            <img src="${data.user.avatar}" class="user-avatar" alt="Avatar" />
                            <span class="user-name">${data.user.username}</span>
                        </div>
                        <a href="/auth/logout" class="btn btn-secondary" style="padding: 6px 12px; font-size: 0.8rem;">Logout</a>
                    `;
                }
            } catch (err) {
                console.error("Auth check failed:", err);
            }
        }
        checkAuth();

        // Obfuscation Trigger
        obfuscateBtn.addEventListener('click', async () => {
            const scriptContent = scriptInput.value;
            const scriptName = scriptNameInput.value;

            if (!scriptContent.trim()) {
                showToast('Please enter or drop your script code first.', 'error');
                return;
            }

            obfuscateBtn.disabled = true;
            obfuscateBtn.innerHTML = `<i data-lucide="loader-2" class="animate-spin" style="width: 20px; height: 20px;"></i> Encrypting Payload...`;
            lucide.createIcons();

            try {
                const response = await fetch('/api/obfuscate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ script: scriptContent, scriptName: scriptName, fileType: 'luau' })
                });

                const result = await response.json();

                if (result.success) {
                    generatedLoaderUrl = result.loader;
                    loaderOutputText.textContent = generatedLoaderUrl;
                    outputContainer.classList.add('active');
                    outputContainer.scrollIntoView({ behavior: 'smooth' });
                    showToast('Script encrypted successfully!', 'success');
                } else {
                    showToast(result.error || 'Obfuscation failed.', 'error');
                }
            } catch (err) {
                showToast('Network error or server unavailable.', 'error');
                console.error(err);
            } finally {
                obfuscateBtn.disabled = false;
                obfuscateBtn.innerHTML = `<i data-lucide="shield-check" style="width: 20px; height: 20px;"></i> Obfuscate Script`;
                lucide.createIcons();
            }
        });

        // Copy Loader to Clipboard
        copyLoaderBtn.addEventListener('click', () => {
            navigator.clipboard.writeText(generatedLoaderUrl).then(() => {
                showToast('Loader copied to clipboard!', 'success');
            }).catch(() => {
                showToast('Failed to copy loader.', 'error');
            });
        });
    </script>
</body>
</html>
