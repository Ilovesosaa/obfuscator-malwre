<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIN OBFUSCATOR | Hardened Luau Protection v5.0</title>
    <!-- FontAwesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-main: #060609;
            --bg-card: rgba(13, 13, 20, 0.75);
            --bg-input: #09090e;
            --accent-red: #ef4444;
            --accent-red-glow: rgba(239, 68, 68, 0.4);
            --accent-crimson: #dc2626;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
            --border-red: rgba(239, 68, 68, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(239, 68, 68, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(185, 28, 28, 0.05) 0%, transparent 40%);
            background-attachment: fixed;
            overflow-x: hidden;
        }

        /* --- Navbar --- */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem 2.5rem;
            background: rgba(6, 6, 9, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 800;
            font-size: 1.25rem;
            letter-spacing: 1px;
        }

        .brand i {
            color: var(--accent-red);
            font-size: 1.5rem;
            filter: drop-shadow(0 0 8px var(--accent-red-glow));
        }

        .brand span {
            background: linear-gradient(135deg, #fff 30%, var(--accent-red) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .user-panel {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .discord-btn {
            background: #5865F2;
            color: white;
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(88, 101, 242, 0.2);
        }

        .discord-btn:hover {
            background: #4752C4;
            transform: translateY(-2px);
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.04);
            padding: 6px 14px 6px 6px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
        }

        .user-profile img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid var(--accent-red);
        }

        .user-profile span {
            font-weight: 600;
            font-size: 0.88rem;
        }

        .logout-btn {
            color: var(--text-secondary);
            margin-left: 5px;
            cursor: pointer;
            transition: color 0.2s;
        }

        .logout-btn:hover {
            color: var(--accent-red);
        }

        /* --- Main Layout --- */
        .container {
            max-width: 1300px;
            width: 100%;
            margin: 2rem auto;
            padding: 0 1.5rem;
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 1.8rem;
            flex-grow: 1;
        }

        @media (max-width: 992px) {
            .container { grid-template-columns: 1fr; }
        }

        /* --- Glass Cards --- */
        .glass-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(16px);
            border-radius: 14px;
            padding: 1.5rem;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.2rem;
            padding-bottom: 0.8rem;
            border-bottom: 1px solid var(--border-color);
        }

        .card-header h2 {
            font-size: 1.1rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-primary);
        }

        .card-header h2 i { color: var(--accent-red); }

        /* --- Code Editor Section --- */
        .editor-wrapper {
            display: flex;
            flex-direction: column;
            gap: 10px;
            height: 520px;
        }

        .editor-toolbar {
            display: flex;
            justify-content: space-between;
            color: var(--text-secondary);
            font-size: 0.8rem;
            padding: 0 4px;
        }

        textarea {
            width: 100%;
            height: 100%;
            background-color: var(--bg-input);
            color: #38bdf8;
            font-family: 'Fira Code', monospace;
            font-size: 0.9rem;
            padding: 1.2rem;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            resize: none;
            outline: none;
            line-height: 1.5;
            transition: border-color 0.2s;
        }

        textarea:focus {
            border-color: var(--border-red);
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.1);
        }

        /* --- Control Sidebar --- */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .input-group {
            margin-bottom: 1.2rem;
        }

        .input-group label {
            display: block;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-group input {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            outline: none;
            font-size: 0.9rem;
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            border-color: var(--accent-red);
        }

        .btn-obfuscate {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, var(--accent-red), var(--accent-crimson));
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 20px var(--accent-red-glow);
            transition: all 0.2s ease;
        }

        .btn-obfuscate:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(239, 68, 68, 0.6);
        }

        .btn-obfuscate:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* --- Output Card --- */
        .output-box {
            display: none;
            background: rgba(4, 4, 6, 0.8);
            border: 1px solid var(--border-red);
            border-radius: 10px;
            padding: 1rem;
            margin-top: 1rem;
        }

        .output-box.active { display: block; }

        .loader-code {
            background: #000;
            color: #4ade80;
            font-family: 'Fira Code', monospace;
            font-size: 0.78rem;
            padding: 0.8rem;
            border-radius: 6px;
            word-break: break-all;
            margin: 0.8rem 0;
            border: 1px solid rgba(74, 222, 128, 0.2);
        }

        .btn-copy {
            width: 100%;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 0.6rem;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-copy:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        /* --- Vault Session List --- */
        .vault-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 220px;
            overflow-y: auto;
        }

        .vault-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            padding: 0.7rem 1rem;
            border-radius: 8px;
            font-size: 0.85rem;
        }

        .vault-info {
            display: flex;
            flex-direction: column;
        }

        .vault-name { font-weight: 600; color: #fff; }
        .vault-time { font-size: 0.75rem; color: var(--text-secondary); }

        .vault-actions {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        .icon-btn:hover { color: var(--accent-red); }

        /* --- Toast Notifications --- */
        #toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            background: #0f172a;
            border-left: 4px solid var(--accent-red);
            color: white;
            padding: 0.9rem 1.4rem;
            border-radius: 6px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            font-size: 0.88rem;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: slideIn 0.3s ease forwards;
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav>
        <div class="brand">
            <i class="fa-solid fa-shield-halved"></i>
            <span>SIN OBFUSCATOR</span>
        </div>

        <div class="user-panel" id="userPanel">
            <!-- Dynamically populated via JS -->
            <a href="/auth/discord" class="discord-btn">
                <i class="fa-brands fa-discord"></i> Login with Discord
            </a>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container">
        <!-- Editor Section -->
        <div class="glass-card">
            <div class="card-header">
                <h2><i class="fa-solid fa-code"></i> Luau Source Code</h2>
                <span id="scriptStats" style="font-size: 0.8rem; color: var(--text-secondary);">0 Lines | 0 Chars</span>
            </div>
            
            <div class="editor-wrapper">
                <textarea id="sourceCode" placeholder="-- Paste your un-obfuscated Luau script here...&#10;function hello()&#10;    print('SIN Shield Active')&#10;end&#10;hello()" spellcheck="false"></textarea>
            </div>
        </div>

        <!-- Sidebar Section -->
        <div class="sidebar">
            <!-- Obfuscation Config -->
            <div class="glass-card">
                <div class="card-header">
                    <h2><i class="fa-solid fa-sliders"></i> Protection Hub</h2>
                </div>

                <div class="input-group">
                    <label>Script Title</label>
                    <input type="text" id="scriptName" placeholder="MyRobloxScript_v1" />
                </div>

                <button class="btn-obfuscate" id="obfuscateBtn" onclick="runObfuscator()">
                    <i class="fa-solid fa-bolt"></i> OBFUSCATE SCRIPT
                </button>

                <!-- Output Box -->
                <div class="output-box" id="outputBox">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <span style="font-size: 0.8rem; font-weight:700; color:var(--accent-red);">LOADER GENERATED</span>
                        <i class="fa-solid fa-check-circle" style="color:#4ade80;"></i>
                    </div>
                    <div class="loader-code" id="loaderOutput"></div>
                    <button class="btn-copy" onclick="copyLoader()">
                        <i class="fa-regular fa-copy"></i> Copy Loader Code
                    </button>
                </div>
            </div>

            <!-- Session History Vault -->
            <div class="glass-card">
                <div class="card-header">
                    <h2><i class="fa-solid fa-vault"></i> Recent Vault</h2>
                </div>
                <div class="vault-list" id="vaultList">
                    <div style="color: var(--text-secondary); font-size: 0.82rem; text-align: center; padding: 1rem;">
                        No scripts generated in this session.
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notifications -->
    <div id="toast-container"></div>

    <script>
        let currentUser = null;
        const vaultHistory = [];

        // Fetch User Session State on Load
        async function checkAuth() {
            try {
                const res = await fetch('/api/me');
                const data = await res.json();
                
                const userPanel = document.getElementById('userPanel');

                if (data.authenticated) {
                    currentUser = data.user;
                    userPanel.innerHTML = `
                        <div class="user-profile">
                            <img src="${data.user.avatar}" alt="Avatar">
                            <span>${data.user.username}</span>
                            <a href="/auth/logout" class="logout-btn" title="Logout">
                                <i class="fa-solid fa-right-from-bracket"></i>
                            </a>
                        </div>
                    `;
                } else {
                    currentUser = null;
                    userPanel.innerHTML = `
                        <a href="/auth/discord" class="discord-btn">
                            <i class="fa-brands fa-discord"></i> Login with Discord
                        </a>
                    `;
                }
            } catch (err) {
                console.error("Auth check error:", err);
            }
        }

        // Live Editor Stats Counter
        const sourceInput = document.getElementById('sourceCode');
        const scriptStats = document.getElementById('scriptStats');

        sourceInput.addEventListener('input', () => {
            const val = sourceInput.value;
            const lines = val ? val.split('\n').length : 0;
            const chars = val.length;
            scriptStats.innerText = `${lines} Lines | ${chars} Chars`;
        });

        // Run Obfuscation
        async function runObfuscator() {
            if (!currentUser) {
                showToast("You must log in with Discord first!", "error");
                return;
            }

            const script = sourceInput.value;
            const scriptName = document.getElementById('scriptName').value || 'Untitled_Script';

            if (!script.trim()) {
                showToast("Please enter Luau code to obfuscate.", "error");
                return;
            }

            const btn = document.getElementById('obfuscateBtn');
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> ENCRYPTING...`;

            try {
                const response = await fetch('/api/obfuscate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ script, scriptName })
                });

                const data = await response.json();

                if (data.success) {
                    showToast("Script hardened successfully!", "success");
                    
                    // Display loader card
                    document.getElementById('loaderOutput').innerText = data.loader;
                    document.getElementById('outputBox').classList.add('active');

                    // Add to vault list
                    vaultHistory.unshift(data);
                    renderVault();
                } else {
                    showToast(data.error || "Obfuscation failed.", "error");
                }
            } catch (err) {
                showToast("Server connection error.", "error");
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-bolt"></i> OBFUSCATE SCRIPT`;
            }
        }

        // Copy Loader to Clipboard
        function copyLoader() {
            const loaderText = document.getElementById('loaderOutput').innerText;
            navigator.clipboard.writeText(loaderText);
            showToast("Loader copied to clipboard!", "success");
        }

        // Render Vault Items
        function renderVault() {
            const vaultList = document.getElementById('vaultList');
            if (vaultHistory.length === 0) return;

            vaultList.innerHTML = vaultHistory.map(item => `
                <div class="vault-item">
                    <div class="vault-info">
                        <span class="vault-name">${item.name}</span>
                        <span class="vault-time">${item.createdAt}</span>
                    </div>
                    <div class="vault-actions">
                        <button class="icon-btn" onclick="copyVaultLoader('${item.loader}')" title="Copy Loader">
                            <i class="fa-regular fa-copy"></i>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function copyVaultLoader(loaderStr) {
            navigator.clipboard.writeText(loaderStr);
            showToast("Vault loader copied!", "success");
        }

        // Toast Helper
        function showToast(msg, type = "info") {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            
            const icon = type === 'success' ? 'fa-check-circle' : 'fa-triangle-exclamation';
            toast.innerHTML = `<i class="fa-solid ${icon}"></i> <span>${msg}</span>`;
            
            container.appendChild(toast);

            setTimeout(() => {
                toast.style.animation = 'slideIn 0.3s ease reverse forwards';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Initialize Page
        checkAuth();
    </script>
</body>
</html>
