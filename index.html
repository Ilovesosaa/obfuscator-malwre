<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error404 | Secure Luau Obfuscator & Host</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #050805;
            --bg-card: #0a120a;
            --border-green: #00ff6633;
            --border-green-hover: #00ff6688;
            --accent-green: #00ff66;
            --accent-glow: rgba(0, 255, 102, 0.25);
            --text-main: #c0f0c0;
            --text-dim: #609060;
            --danger: #ff4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'JetBrains Mono', monospace;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Scanline background effect */
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 999;
            background-size: 100% 3px, 3px 100%;
            pointer-events: none;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            border-bottom: 1px solid var(--border-green);
            background: rgba(5, 8, 5, 0.95);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent-green);
            text-shadow: 0 0 10px var(--accent-green);
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo span {
            color: #fff;
        }

        .user-widget {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .discord-btn {
            background-color: #5865F2;
            color: #fff;
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
            box-shadow: 0 0 15px rgba(88, 101, 242, 0.4);
        }

        .discord-btn:hover {
            background-color: #4752C4;
            box-shadow: 0 0 20px rgba(88, 101, 242, 0.7);
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--bg-card);
            border: 1px solid var(--border-green);
            padding: 6px 14px;
            border-radius: 6px;
        }

        .user-profile img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 1px solid var(--accent-green);
        }

        .logout-btn {
            color: var(--danger);
            text-decoration: none;
            font-size: 0.8rem;
            margin-left: 10px;
        }

        main {
            flex: 1;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 40px 20px;
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 30px;
        }

        @media(max-width: 900px) {
            main {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-green);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.03);
        }

        h2 {
            font-size: 1.1rem;
            color: var(--accent-green);
            margin-bottom: 15px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .editor-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 0.8rem;
            color: var(--text-dim);
        }

        input[type="text"], select {
            background: #030503;
            border: 1px solid var(--border-green);
            color: var(--text-main);
            padding: 12px;
            border-radius: 6px;
            outline: none;
            font-size: 0.9rem;
        }

        input[type="text"]:focus, select:focus {
            border-color: var(--accent-green);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        textarea {
            background: #030503;
            border: 1px solid var(--border-green);
            color: var(--accent-green);
            padding: 15px;
            border-radius: 6px;
            min-height: 280px;
            resize: vertical;
            outline: none;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        textarea:focus {
            border-color: var(--accent-green);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .action-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-primary {
            background-color: var(--accent-green);
            color: #000;
            border: none;
            padding: 12px 25px;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 0 15px var(--accent-glow);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary:hover {
            background-color: #00cc52;
            box-shadow: 0 0 25px rgba(0, 255, 102, 0.5);
        }

        .output-box {
            margin-top: 20px;
            background: #020302;
            border: 1px solid var(--border-green);
            padding: 15px;
            border-radius: 6px;
            display: none;
        }

        .output-box.active {
            display: block;
        }

        .loader-link {
            color: transparent;
            background-color: #000;
            text-shadow: 0 0 8px rgba(0, 255, 102, 0.2);
            user-select: none;
            cursor: pointer;
            word-break: break-all;
            font-size: 0.85rem;
            margin: 10px 0;
            padding: 8px;
            border: 1px dashed var(--border-green);
            border-radius: 4px;
            display: block;
            transition: all 0.2s ease;
        }

        .loader-link:hover, .loader-link.revealed {
            color: var(--accent-green);
            background-color: #050805;
            text-shadow: none;
            user-select: text;
        }

        .vault-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 520px;
            overflow-y: auto;
        }

        .vault-item {
            background: #030503;
            border: 1px solid var(--border-green);
            padding: 12px;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: border-color 0.2s;
        }

        .vault-item:hover {
            border-color: var(--accent-green);
        }

        .vault-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .vault-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            overflow: hidden;
        }

        .vault-name {
            font-weight: 700;
            font-size: 0.9rem;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .vault-date {
            font-size: 0.75rem;
            color: var(--text-dim);
        }

        .vault-actions {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            background: none;
            border: 1px solid var(--border-green);
            color: var(--text-main);
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.75rem;
            transition: all 0.2s;
        }

        .icon-btn:hover {
            background: var(--accent-green);
            color: #000;
            border-color: var(--accent-green);
        }

        .icon-btn.delete:hover {
            background: var(--danger);
            color: #fff;
            border-color: var(--danger);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            ERROR<span>404</span> <span style="font-size: 0.7rem; color: var(--text-dim); border: 1px solid var(--border-green); padding: 2px 6px; border-radius: 4px;">OBFUSCATOR</span>
        </div>
        <div class="user-widget" id="userWidget">
            <!-- Dynamically populated via auth API -->
        </div>
    </header>

    <main>
        <!-- Editor / Deploy Section -->
        <div class="card">
            <h2>// SCRIPT DEPLOYMENT ENGINE</h2>
            <div class="editor-container">
                <input type="hidden" id="editId" value="">
                <div class="input-group">
                    <label>SCRIPT NAME</label>
                    <input type="text" id="scriptName" placeholder="e.g. Universal Aimbot / UI Library">
                </div>
                <div class="input-group">
                    <label>LANGUAGE ENVIRONMENT</label>
                    <select id="fileType">
                        <option value="luau">Luau (Roblox Optimized)</option>
                        <option value="lua">Lua 5.1 / Standard</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>SOURCE CODE & UI LIBRARIES</label>
                    <textarea id="scriptInput" placeholder="Paste your script, Rayfield, or Orion UI library code here..."></textarea>
                </div>
                <div class="action-row">
                    <span id="statusMsg" style="font-size: 0.8rem; color: var(--accent-green);"></span>
                    <button class="btn-primary" onclick="deployScript()">Obfuscate & Host</button>
                </div>

                <div class="output-box" id="outputBox">
                    <label>GENERATED LOADSTRING (Click to Reveal):</label>
                    <code class="loader-link" id="loaderOutput" onclick="toggleReveal(this)" title="Click to reveal"></code>
                    <div style="margin-top: 10px; display: flex; gap: 10px;">
                        <button class="icon-btn" onclick="copyLoader()">Copy Loadstring</button>
                        <button class="icon-btn" onclick="toggleRevealManual()">Toggle Visibility</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Script Vault Section -->
        <div class="card">
            <h2>// SCRIPT VAULT (OWNER ONLY)</h2>
            <div class="vault-list" id="vaultList">
                <div style="color: var(--text-dim); font-size: 0.85rem; text-align: center; padding: 20px;">
                    Sign in with Discord to view your deployed scripts.
                </div>
            </div>
        </div>
    </main>

    <script>
        // Check user session on load
        async function checkUser() {
            try {
                const res = await fetch('/api/me');
                const data = await res.json();
                const widget = document.getElementById('userWidget');
                if (data.authenticated) {
                    widget.innerHTML = `
                        <div class="user-profile">
                            <img src="${data.user.avatar}" alt="Avatar">
                            <span style="font-size: 0.85rem; font-weight: 600;">${data.user.username}</span>
                            <a href="/auth/logout" class="logout-btn">[LOGOUT]</a>
                        </div>
                    `;
                    loadVault();
                } else {
                    widget.innerHTML = `
                        <a href="/auth/discord" class="discord-btn">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.011c3.927 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
                            Login with Discord
                        </a>
                    `;
                }
            } catch (e) {
                console.error("Auth check failed", e);
            }
        }

        // Safe Base64 encoding supporting all UTF-8 characters
        function safeBase64Encode(str) {
            const bytes = new TextEncoder().encode(str);
            let binString = "";
            for (let i = 0; i < bytes.length; i++) {
                binString += String.fromCharCode(bytes[i]);
            }
            return btoa(binString);
        }

        // Lua/Luau Byte-Array & Bitwise XOR Obfuscator Engine
        function obfuscateLua(source) {
            const encoder = new TextEncoder();
            const bytes = encoder.encode(source);
            const key = Math.floor(Math.random() * 253) + 1; // Random non-zero XOR key
            
            const xorBytes = [];
            for (let i = 0; i < bytes.length; i++) {
                xorBytes.push(bytes[i] ^ key);
            }

            // Generate junk variable names to disguise execution flow
            const randVar = (prefix) => prefix + '_' + Math.random().toString(36).substring(2, 8);
            const vData = randVar('_0xdata');
            const vKey = randVar('_0xkey');
            const vRes = randVar('_0xres');
            const vByte = randVar('_0xb');
            const vChar = randVar('_0xc');
            const vEnv = randVar('_0xenv');

            // Construct self-unpacking Lua/Luau wrapper script
            const wrappedScript = [
                `local ${vData} = {${xorBytes.join(',')}}`,
                `local ${vKey} = ${key}`,
                `local ${vRes} = {}`,
                `for i = 1, #${vData} do`,
                `    local ${vByte} = ${vData}[i]`,
                `    -- Bitwise XOR restoration via bit32/bit or manual arithmetic fallbacks`,
                `    local ${vChar} = (bit32 and bit32.bxor(${vByte}, ${vKey}))`,
                `        or (bit and bit.bxor(${vByte}, ${vKey}))`,
                `        or (function(a,b) local r,p=0,1 while a>0 or b>0 do if (a%2) ~= (b%2) then r=r+p end a=math.floor(a/2) b=math.floor(b/2) p=p*2 end return r end)(${vByte}, ${vKey})`,
                `    ${vRes}[i] = string.char(${vChar})`,
                `end`,
                `local ${vEnv} = loadstring or load`,
                `return ${vEnv}(table.concat(${vRes}))()`
            ].join('\n');

            return wrappedScript;
        }

        async function deployScript() {
            const scriptName = document.getElementById('scriptName').value;
            const fileType = document.getElementById('fileType').value;
            const scriptInput = document.getElementById('scriptInput').value;
            const editId = document.getElementById('editId').value;
            const statusMsg = document.getElementById('statusMsg');

            if (!scriptInput.trim()) {
                statusMsg.style.color = 'var(--danger)';
                statusMsg.innerText = 'Error: Script input is empty.';
                return;
            }

            statusMsg.style.color = 'var(--accent-green)';
            statusMsg.innerText = 'Obfuscating and deploying...';

            try {
                // Apply byte array XOR obfuscation before sending payload
                const obfuscatedCode = obfuscateLua(scriptInput);
                const payload = safeBase64Encode(obfuscatedCode);

                const res = await fetch('/api/obfuscate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ scriptPayload: payload, scriptName, fileType, editId })
                });

                const data = await res.json();
                if (data.success) {
                    statusMsg.innerText = 'Successfully obfuscated & hosted!';
                    document.getElementById('outputBox').classList.add('active');
                    document.getElementById('loaderOutput').innerText = data.loader;
                    document.getElementById('editId').value = '';
                    loadVault();
                } else {
                    statusMsg.style.color = 'var(--danger)';
                    statusMsg.innerText = 'Error: ' + data.error;
                }
            } catch (err) {
                statusMsg.style.color = 'var(--danger)';
                statusMsg.innerText = 'Network error during deployment.';
            }
        }

        async function loadVault() {
            try {
                const res = await fetch('/api/vault');
                const data = await res.json();
                const vaultList = document.getElementById('vaultList');
                
                if (!data.success || data.scripts.length === 0) {
                    vaultList.innerHTML = `<div style="color: var(--text-dim); font-size: 0.85rem; text-align: center; padding: 20px;">No deployed scripts in vault.</div>`;
                    return;
                }

                vaultList.innerHTML = data.scripts.map(s => `
                    <div class="vault-item">
                        <div class="vault-header">
                            <div class="vault-info">
                                <span class="vault-name">${s.name}</span>
                                <span class="vault-date">${s.fileType.toUpperCase()} • ${s.createdAt}</span>
                            </div>
                            <div class="vault-actions">
                                <button class="icon-btn" onclick="copyVaultLoader(this)">Copy</button>
                                <button class="icon-btn" onclick="editScript('${s.id}', '${s.name}', '${s.fileType}', ` + encodeURIComponent(JSON.stringify(s.code)) + `)">Edit</button>
                                <button class="icon-btn delete" onclick="deleteScript('${s.id}')">Del</button>
                            </div>
                        </div>
                        <div>
                            <label style="font-size: 0.7rem; color: var(--text-dim);">LOADSTRING (Click to Reveal):</label>
                            <code class="loader-link" onclick="toggleReveal(this)">${s.loader}</code>
                        </div>
                    </div>
                `).join('');
            } catch (e) {
                console.error("Failed to load vault", e);
            }
        }

        function editScript(id, name, fileType, code) {
            document.getElementById('editId').value = id;
            document.getElementById('scriptName').value = name;
            document.getElementById('fileType').value = fileType;
            document.getElementById('scriptInput').value = decodeURIComponent(code);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function deleteScript(id) {
            if (!confirm('Are you sure you want to delete this script?')) return;
            await fetch('/api/delete', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id })
            });
            loadVault();
        }

        function copyLoader() {
            const text = document.getElementById('loaderOutput').innerText;
            navigator.clipboard.writeText(text);
            alert('Loadstring copied to clipboard!');
        }

        function copyVaultLoader(btn) {
            const codeEl = btn.closest('.vault-item').querySelector('.loader-link');
            navigator.clipboard.writeText(codeEl.innerText);
            alert('Loadstring copied to clipboard!');
        }

        function toggleReveal(element) {
            element.classList.toggle('revealed');
        }

        function toggleRevealManual() {
            const output = document.getElementById('loaderOutput');
            output.classList.toggle('revealed');
        }

        checkUser();
    </script>
</body>
</html>
