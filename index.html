<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIN | Next-Gen Luau Script Protection</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #030305;
            --card-bg: rgba(13, 13, 20, 0.65);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent-red: #ef4444;
            --accent-glow: rgba(239, 68, 68, 0.4);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-dark: #64748b;
            --font-sans: 'Plus Jakarta Sans', sans-serif;
            --font-code: 'JetBrains Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-primary);
            font-family: var(--font-sans);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        .ambient-glow-1 {
            position: absolute;
            top: -150px;
            left: 50%;
            transform: translateX(-50%);
            width: 800px;
            height: 400px;
            background: radial-gradient(circle, rgba(239, 68, 68, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
            filter: blur(80px);
            z-index: -1;
            pointer-events: none;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: -1;
            pointer-events: none;
        }

        header {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            text-decoration: none;
        }

        .brand-logo {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, #ef4444, #991b1b);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            color: white;
            font-size: 1.1rem;
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .brand-title {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--text-primary);
        }

        .brand-badge {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: var(--accent-red);
            font-size: 0.65rem;
            font-weight: 700;
            padding: 0.25rem 0.5rem;
            border-radius: 20px;
        }

        .auth-btn {
            background: #5865F2;
            color: white;
            text-decoration: none;
            padding: 0.65rem 1.3rem;
            border-radius: 10px;
            font-size: 0.88rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            transition: all 0.2s ease;
        }

        .auth-btn:hover {
            transform: translateY(-2px);
        }

        .profile-card {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 0.4rem 1rem 0.4rem 0.5rem;
            border-radius: 30px;
        }

        .profile-card img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid var(--accent-red);
        }

        .profile-name { font-size: 0.85rem; font-weight: 700; }
        .logout-link { color: var(--text-dark); text-decoration: none; font-size: 0.75rem; }
        .logout-link:hover { color: var(--accent-red); }

        main {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(16px);
            border-radius: 18px;
            padding: 1.8rem;
        }

        .card-header { margin-bottom: 1.5rem; }
        .card-title h2 { font-size: 1.3rem; font-weight: 700; }
        .card-title p { font-size: 0.85rem; color: var(--text-secondary); margin-top: 0.3rem; }

        .input-field-group { margin-bottom: 1.2rem; }
        .input-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }

        input[type="text"] {
            width: 100%;
            background: rgba(4, 4, 6, 0.8);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            color: var(--text-primary);
            padding: 0.85rem 1rem;
            outline: none;
        }

        /* FILE DROP ZONE */
        .file-drop-zone {
            background: rgba(4, 4, 6, 0.6);
            border: 2px dashed var(--card-border);
            border-radius: 12px;
            padding: 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .file-drop-zone:hover, .file-drop-zone.dragover {
            border-color: var(--accent-red);
            background: rgba(239, 68, 68, 0.05);
        }

        .drop-icon { font-size: 1.8rem; margin-bottom: 0.3rem; }
        .drop-text { font-size: 0.85rem; color: var(--text-secondary); }
        .browse-link { color: var(--accent-red); font-weight: 700; text-decoration: underline; }

        .editor-wrapper {
            background: rgba(4, 4, 6, 0.85);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            overflow: hidden;
            margin-top: 0.8rem;
        }

        .editor-toolbar {
            background: rgba(255, 255, 255, 0.02);
            border-bottom: 1px solid var(--card-border);
            padding: 0.6rem 1rem;
            display: flex;
            justify-content: space-between;
        }

        .editor-lang {
            font-family: var(--font-code);
            font-size: 0.75rem;
            color: var(--accent-red);
            font-weight: 700;
        }

        .editor-clear-btn {
            background: transparent;
            border: none;
            color: var(--text-dark);
            font-size: 0.75rem;
            cursor: pointer;
        }

        textarea {
            width: 100%;
            height: 280px;
            background: transparent;
            border: none;
            color: #e2e8f0;
            padding: 1rem;
            font-family: var(--font-code);
            font-size: 0.88rem;
            line-height: 1.6;
            outline: none;
            resize: vertical;
            user-select: text;
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, var(--accent-red), #b91c1c);
            color: white;
            border: none;
            padding: 1rem;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 20px var(--accent-glow);
        }

        .output-panel {
            display: none;
            margin-top: 1.5rem;
            background: rgba(6, 78, 59, 0.15);
            border: 1px solid rgba(52, 211, 153, 0.3);
            border-radius: 12px;
            padding: 1.2rem;
        }

        .output-panel.active { display: block; }

        .output-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.8rem;
        }

        .loader-output-code {
            background: rgba(4, 4, 6, 0.9);
            border: 1px solid var(--card-border);
            padding: 0.85rem;
            border-radius: 8px;
            font-family: var(--font-code);
            font-size: 0.82rem;
            color: #38bdf8;
            word-break: break-all;
            user-select: text;
        }

        #toastContainer {
            position: fixed;
            bottom: 20px; right: 20px;
            display: flex; flex-direction: column; gap: 10px;
            z-index: 9999;
        }

        .toast {
            background: rgba(13, 13, 20, 0.9);
            border: 1px solid var(--card-border);
            color: white; padding: 0.85rem 1.2rem;
            border-radius: 10px; font-size: 0.85rem;
            display: flex; align-items: center; gap: 0.8rem;
        }
        .toast-error { border-color: rgba(239, 68, 68, 0.5); }
        .toast-success { border-color: rgba(52, 211, 153, 0.5); }
    </style>
</head>
<body>

    <div class="ambient-glow-1"></div>
    <div id="toastContainer"></div>

    <header>
        <a href="/" class="brand">
            <div class="brand-logo">S</div>
            <span class="brand-title">SIN OBFUSCATOR</span>
            <span class="brand-badge">v5.0</span>
        </a>
        <div id="userNav"></div>
    </header>

    <main>
        <section class="card">
            <div class="card-header">
                <div class="card-title">
                    <h2>Script Encryption Engine</h2>
                    <p>Obfuscate .lua and .luau files into protected memory links.</p>
                </div>
            </div>

            <div class="input-field-group">
                <div class="input-label">Script Identifier</div>
                <input type="text" id="scriptName" placeholder="e.g. MainHub_v2">
            </div>

            <div class="input-field-group">
                <div class="input-label">
                    <span>Source Code (.lua / .luau)</span>
                    <span id="charCount" style="color: var(--text-dark);">0 chars</span>
                </div>

                <div id="dropZone" class="file-drop-zone">
                    <input type="file" id="fileInput" accept=".lua,.luau,.txt" style="display: none;" />
                    <div class="drop-icon">📁</div>
                    <div class="drop-text">Drag & drop your <b>.lua</b> or <b>.luau</b> file here, or <span class="browse-link">browse</span></div>
                </div>

                <div class="editor-wrapper">
                    <div class="editor-toolbar">
                        <span class="editor-lang" id="detectedFileType">LUAU / LUA 5.1</span>
                        <button class="editor-clear-btn" id="clearBtn">Clear Editor</button>
                    </div>
                    <textarea id="sourceCode" placeholder="-- Paste or drop your .lua / .luau script here..."></textarea>
                </div>
            </div>

            <button id="obfuscateBtn" class="btn-submit">Obfuscate Script</button>

            <div id="outputBox" class="output-panel">
                <div class="output-header">
                    <span style="color: #34d399; font-weight: 700;">✅ Compiled & Hosted</span>
                    <button style="background: rgba(52, 211, 153, 0.2); border: 1px solid rgba(52, 211, 153, 0.4); color: #6ee7b7; padding: 0.4rem 0.8rem; border-radius: 6px; cursor: pointer;" onclick="copyLoader()">Copy Loader Link</button>
                </div>
                <div class="loader-output-code" id="loaderOutput"></div>
            </div>
        </section>
    </main>

    <script>
        let currentDetectedType = 'luau';

        function showToast(msg, type = 'error') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.innerHTML = `<span>${type === 'error' ? '⚠️' : '✅'}</span><span>${msg}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        }

        async function checkAuth() {
            try {
                const res = await fetch('/api/me');
                const data = await res.json();
                const userNav = document.getElementById('userNav');

                if (data.authenticated) {
                    userNav.innerHTML = `
                        <div class="profile-card">
                            <img src="${data.user.avatar}" alt="Avatar">
                            <div class="profile-info">
                                <span class="profile-name">${data.user.username}</span>
                                <a href="/auth/logout" class="logout-link">Sign Out</a>
                            </div>
                        </div>
                    `;
                } else {
                    userNav.innerHTML = `<a href="/auth/discord" class="auth-btn">Login with Discord</a>`;
                }
            } catch (err) {}
        }

        // DRAG & DROP / FILE INPUT LOGIC
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const sourceInput = document.getElementById('sourceCode');
        const detectedFileType = document.getElementById('detectedFileType');

        dropZone.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) handleFile(e.target.files[0]);
        });

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0]);
        });

        function handleFile(file) {
            const ext = file.name.split('.').pop().toLowerCase();
            if (ext !== 'lua' && ext !== 'luau' && ext !== 'txt') {
                showToast("Only .lua and .luau files are supported!");
                return;
            }

            const reader = new FileReader();
            reader.onload = (e) => {
                sourceInput.value = e.target.result;
                document.getElementById('charCount').innerText = `${sourceInput.value.length} chars`;
                currentDetectedType = ext === 'txt' ? 'lua' : ext;
                detectedFileType.innerText = currentDetectedType.toUpperCase();
                
                const scriptNameInput = document.getElementById('scriptName');
                if (!scriptNameInput.value) {
                    scriptNameInput.value = file.name.replace(/\.[^/.]+$/, "");
                }
                showToast(`Loaded ${file.name} successfully!`, "success");
            };
            reader.readAsText(file);
        }

        sourceInput.addEventListener('input', () => {
            document.getElementById('charCount').innerText = `${sourceInput.value.length} chars`;
        });

        document.getElementById('clearBtn').addEventListener('click', () => {
            sourceInput.value = '';
            document.getElementById('charCount').innerText = '0 chars';
        });

        document.getElementById('obfuscateBtn').addEventListener('click', async () => {
            const script = sourceInput.value;
            const scriptName = document.getElementById('scriptName').value;

            if (!script.trim()) {
                showToast("Enter or upload code before obfuscating.");
                return;
            }

            try {
                const res = await fetch('/api/obfuscate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ script, scriptName, fileType: currentDetectedType })
                });

                const data = await res.json();
                if (!res.ok || !data.success) throw new Error(data.error || "Obfuscation failed");

                document.getElementById('loaderOutput').innerText = data.loader;
                document.getElementById('outputBox').classList.add('active');
                showToast("Compiled successfully!", "success");

            } catch (err) {
                showToast(err.message);
            }
        });

        function copyLoader() {
            navigator.clipboard.writeText(document.getElementById('loaderOutput').innerText);
            showToast("Copied loader to clipboard!", "success");
        }

        checkAuth();
    </script>
</body>
</html>
