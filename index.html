<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIN Obfuscator - Cloud Hub</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #08080a;
      --card-bg: #111116;
      --card-border: #221c24;
      --accent-red: #ef4444;
      --accent-glow: rgba(239, 68, 68, 0.45);
      --text: #f8fafc;
      --text-sub: #94a3b8;
      --green: #22c55e;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .header {
      text-align: center;
    }

    .header h1 {
      font-size: 2.75rem;
      font-weight: 900;
      letter-spacing: -0.02em;
    }

    .header h1 span {
      color: var(--accent-red);
      text-shadow: 0 0 30px var(--accent-glow);
    }

    .header p {
      color: var(--text-sub);
      margin-top: 0.5rem;
      font-size: 0.95rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      box-shadow: 0 10px 40px rgba(239, 68, 68, 0.08);
    }

    .options-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem;
      background: #171217;
      padding: 1rem;
      border-radius: 8px;
      border: 1px solid var(--card-border);
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.875rem;
      color: #cbd5e1;
      cursor: pointer;
    }

    .checkbox-label input {
      accent-color: var(--accent-red);
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    textarea {
      width: 100%;
      height: 280px;
      background: #0b0b0f;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      color: #f87171;
      font-family: "Fira Code", Consolas, Monaco, monospace;
      font-size: 0.9rem;
      padding: 1rem;
      resize: vertical;
      outline: none;
      line-height: 1.5;
    }

    textarea:focus {
      border-color: var(--accent-red);
      box-shadow: 0 0 15px rgba(239, 68, 68, 0.2);
    }

    .btn-build {
      background: linear-gradient(135deg, #ef4444 0%, #991b1b 100%);
      color: #fff;
      font-size: 1.05rem;
      font-weight: 700;
      padding: 0.9rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 20px var(--accent-glow);
      transition: all 0.2s ease;
    }

    .btn-build:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 28px rgba(239, 68, 68, 0.65);
    }

    .result-box {
      display: none;
      background: #171217;
      border: 1px dashed var(--accent-red);
      border-radius: 8px;
      padding: 1.25rem;
      flex-direction: column;
      gap: 0.75rem;
    }

    .result-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--green);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .loader-code {
      background: #0b0b0f;
      border: 1px solid var(--card-border);
      padding: 0.85rem;
      border-radius: 6px;
      font-family: monospace;
      font-size: 0.9rem;
      color: var(--green);
      word-break: break-all;
      user-select: all;
    }

    .btn-copy {
      background: #231924;
      color: #fff;
      border: 1px solid #38253a;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      align-self: flex-start;
      transition: all 0.2s;
    }

    .btn-copy:hover {
      background: #362238;
      border-color: var(--accent-red);
    }
  </style>
</head>
<body>

  <div class="container">
    <header class="header">
      <h1><span>SIN</span> Obfuscator</h1>
      <p>Hardened Cloud Security & Unstealable 1-Line Loader Generation</p>
    </header>

    <main class="card">
      <div class="options-bar">
        <label class="checkbox-label">
          <input type="checkbox" id="chkAntiHttpSpy" checked /> Enable Anti-HttpSpy & Decompiler Traps
        </label>

        <label class="checkbox-label">
          <input type="checkbox" id="chkHwidLock" /> Enable HWID Lock Protection
        </label>
      </div>

      <textarea id="sourceCode" placeholder="-- Paste your raw Luau script here..." spellcheck="false"></textarea>

      <button class="btn-build" onclick="buildCloudLoader()">Obfuscate with SIN</button>

      <div class="result-box" id="resultContainer">
        <span class="result-title">✔ SIN Cloud Loader Generated</span>
        <div class="loader-code" id="loaderResult"></div>
        <button class="btn-copy" onclick="copyLoader()">Copy Loader Script</button>
      </div>
    </main>
  </div>

  <script>
    window.onload = function() {
      document.getElementById('sourceCode').value = 
`-- Protected by SIN Obfuscator
local Players = game:GetService("Players")
local LocalPlayer = Players.LocalPlayer

print("==========================================")
print("SIN Obfuscator Payload Successfully Loaded!")
print("Welcome, " .. tostring(LocalPlayer))
print("==========================================")`;
    };

    async function buildCloudLoader() {
      const script = document.getElementById('sourceCode').value;
      const antiHttpSpy = document.getElementById('chkAntiHttpSpy').checked;
      const hwidLock = document.getElementById('chkHwidLock').checked;

      if (!script.trim()) {
        alert("Please enter Luau source code first!");
        return;
      }

      try {
        const response = await fetch('/api/obfuscate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ script, antiHttpSpy, hwidLock })
        });

        const data = await response.json();

        if (data.success) {
          document.getElementById('resultContainer').style.display = 'flex';
          document.getElementById('loaderResult').innerText = data.loader;
        } else {
          alert("Obfuscation Error: " + data.error);
        }
      } catch (err) {
        alert("Failed to connect to SIN Backend Server!");
      }
    }

    function copyLoader() {
      const loaderText = document.getElementById('loaderResult').innerText;
      navigator.clipboard.writeText(loaderText);
      alert("SIN Loader script copied to clipboard!");
    }
  </script>

</body>
</html>
