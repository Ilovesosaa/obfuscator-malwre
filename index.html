<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sinobfuscator | Lua Script Obfuscator & Vault</title>
    <style>
        :root {
            --bg-color: #0f111a;
            --panel-bg: #1a1c29;
            --border-color: #2f334d;
            --accent-color: #0070f3;
            --accent-hover: #0051cc;
            --discord-color: #5865F2;
            --discord-hover: #4752C4;
            --success-color: #50fa7b;
            --error-color: #ff5555;
            --text-main: #ffffff;
            --text-muted: #8b949e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 900px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 1.5rem;
            letter-spacing: 0.5px;
        }

        .discord-login-btn {
            background-color: var(--discord-color);
            color: white;
            padding: 8px 16px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        .discord-login-btn:hover {
            background-color: var(--discord-hover);
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-profile img {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 2px solid var(--border-color);
        }

        .user-profile .user-info {
            display: flex;
            flex-direction: column;
        }

        .user-profile span {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .user-profile a {
            color: var(--error-color);
            text-decoration: none;
            font-size: 0.8rem;
        }

        .user-profile a:hover {
            text-decoration: underline;
        }

        .editor-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .editor-grid {
                grid-template-columns: 1fr;
            }
        }

        .editor-pane {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        textarea {
            width: 100%;
            height: 200px;
            background: var(--bg-color);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9rem;
            resize: vertical;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .action-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        .section-box {
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
            margin-top: 20px;
        }

        .section-box h3 {
            margin-bottom: 15px;
            font-size: 1.1rem;
        }

        .save-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px;
            background: var(--bg-color);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.9rem;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        #save-status {
            font-size: 0.85rem;
            font-weight: 600;
        }

        .vault-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 250px;
            overflow-y: auto;
        }

        .vault-item {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 12px 15px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .vault-item-info {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .vault-item-name {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .vault-item-date {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .btn-group {
            display: flex;
            gap: 5px;
        }

        .load-btn {
            background-color: #2ecc71;
            padding: 6px 12px;
            font-size: 0.8rem;
        }

        .load-btn:hover {
            background-color: #27ae60;
        }

        .copy-btn {
            background-color: var(--discord-color);
            padding: 6px 12px;
            font-size: 0.8rem;
        }

        .copy-btn:hover {
            background-color: var(--discord-hover);
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>Sinobfuscator</h1>
        <div id="auth-section">
            <div id="logged-out" style="display: none;">
                <a href="/auth/discord" class="discord-login-btn">Login with Discord</a>
            </div>
            <div id="logged-in" class="user-profile" style="display: none;">
                <img id="user-avatar" src="" alt="Avatar">
                <div class="user-info">
                    <span id="username-display"></span>
                    <a href="/auth/logout">Logout</a>
                </div>
            </div>
        </div>
    </header>

    <div class="editor-grid">
        <div class="editor-pane">
            <label for="input-code-element">Input Script</label>
            <textarea id="input-code-element" placeholder="Paste your Lua script here..."></textarea>
        </div>
        <div class="editor-pane">
            <label for="output-code-element">Obfuscated Output</label>
            <textarea id="output-code-element" placeholder="Obfuscated result will appear here..."></textarea>
        </div>
    </div>

    <div class="action-bar">
        <button id="obfuscate-btn">Obfuscate Script</button>
    </div>

    <!-- Save Script Vault Section -->
    <div id="save-section" class="section-box" style="display: none;">
        <h3>Save to Vault</h3>
        <div class="save-controls">
            <input type="text" id="script-name-input" placeholder="Enter script name...">
            <button id="save-btn">Save</button>
            <span id="save-status"></span>
        </div>
    </div>

    <!-- Vault List Section -->
    <div id="vault-section" class="section-box" style="display: none;">
        <h3>My Saved Vault Scripts</h3>
        <ul id="vault-list" class="vault-list">
            <li class="vault-item">Loading vault...</li>
        </ul>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", async () => {
        const loggedOutDiv = document.getElementById("logged-out");
        const loggedInDiv = document.getElementById("logged-in");
        const saveSection = document.getElementById("save-section");
        const vaultSection = document.getElementById("vault-section");
        const userAvatar = document.getElementById("user-avatar");
        const usernameDisplay = document.getElementById("username-display");

        try {
            const res = await fetch('/api/me');
            const data = await res.json();

            if (data.authenticated) {
                loggedOutDiv.style.display = "none";
                loggedInDiv.style.display = "flex";
                saveSection.style.display = "block";
                vaultSection.style.display = "block";

                userAvatar.src = data.user.avatar;
                usernameDisplay.textContent = data.user.username;

                loadVaultScripts();
            } else {
                loggedOutDiv.style.display = "block";
                loggedInDiv.style.display = "none";
                saveSection.style.display = "none";
                vaultSection.style.display = "none";
            }
        } catch (err) {
            console.error("Auth check failed:", err);
        }

        const obfuscateBtn = document.getElementById("obfuscate-btn");
        if (obfuscateBtn) {
            obfuscateBtn.addEventListener("click", () => {
                const input = document.getElementById("input-code-element").value;
                if (!input) return;
                document.getElementById("output-code-element").value = "-- Obfuscated by Sinobfuscator\n" + btoa(input);
            });
        }

        const saveBtn = document.getElementById("save-btn");
        if (saveBtn) {
            saveBtn.addEventListener("click", async () => {
                const scriptName = document.getElementById("script-name-input").value;
                const scriptContent = document.getElementById("output-code-element").value;
                const statusSpan = document.getElementById("save-status");

                if (!scriptName || !scriptContent) {
                    statusSpan.textContent = "Name and content required!";
                    statusSpan.style.color = "var(--error-color)";
                    return;
                }

                try {
                    const response = await fetch('/api/save-script', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ scriptName, scriptContent })
                    });

                    const result = await response.json();
                    if (result.success) {
                        statusSpan.textContent = "Saved successfully!";
                        statusSpan.style.color = "var(--success-color)";
                        document.getElementById("script-name-input").value = "";
                        loadVaultScripts();
                    } else {
                        statusSpan.textContent = result.error || "Failed to save.";
                        statusSpan.style.color = "var(--error-color)";
                    }
                } catch (err) {
                    console.error("Save error:", err);
                    statusSpan.textContent = "Error saving script.";
                    statusSpan.style.color = "var(--error-color)";
                }
            });
        }
    });

    async function loadVaultScripts() {
        const vaultList = document.getElementById("vault-list");
        if (!vaultList) return;

        try {
            const res = await fetch('/api/my-scripts');
            const data = await res.json();

            vaultList.innerHTML = "";
            if (data.scripts && data.scripts.length > 0) {
                data.scripts.forEach(script => {
                    const li = document.createElement("li");
                    li.className = "vault-item";
                    
                    const infoDiv = document.createElement("div");
                    infoDiv.className = "vault-item-info";
                    infoDiv.innerHTML = `
                        <span class="vault-item-name">${script.script_name}</span>
                        <span class="vault-item-date">${new Date(script.created_at).toLocaleDateString()}</span>
                    `;
                    
                    const btnGroup = document.createElement("div");
                    btnGroup.className = "btn-group";

                    const loadBtn = document.createElement("button");
                    loadBtn.textContent = "Load";
                    loadBtn.className = "load-btn";
                    loadBtn.onclick = () => {
                        document.getElementById("output-code-element").value = script.script_content;
                    };

                    const copyBtn = document.createElement("button");
                    copyBtn.textContent = "Copy Loadstring";
                    copyBtn.className = "copy-btn";
                    copyBtn.onclick = () => {
                        const loadstringText = `loadstring(game:HttpGet("https://sinobfuscator.vercel.app/v3/loader/${script.id}"))()`;
                        navigator.clipboard.writeText(loadstringText);
                        alert("Loadstring copied to clipboard!");
                    };

                    btnGroup.appendChild(loadBtn);
                    btnGroup.appendChild(copyBtn);

                    li.appendChild(infoDiv);
                    li.appendChild(btnGroup);
                    vaultList.appendChild(li);
                });
            } else {
                vaultList.innerHTML = `<li class="vault-item" style="justify-content: center; color: var(--text-muted);">No saved scripts found in your vault.</li>`;
            }
        } catch (err) {
            console.error("Failed to load vault:", err);
            vaultList.innerHTML = `<li class="vault-item" style="justify-content: center; color: var(--error-color);">Error loading saved scripts.</li>`;
        }
    }
</script>

</body>
</html>
