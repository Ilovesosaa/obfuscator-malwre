<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERROR404 // OBFUSCATION & DISTRIBUTION SUITE</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,700;1,400&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <style>
        :root {
            --bg-base: #010302;
            --bg-surface: #050a06;
            --bg-card: rgba(8, 16, 10, 0.85);
            --bg-input: #020503;
            --border: rgba(0, 255, 102, 0.15);
            --border-bright: #00ff66;
            --accent: #00ff66;
            --accent-dim: #008033;
            --accent-glow: rgba(0, 255, 102, 0.25);
            --text-main: #e0f8e0;
            --text-dim: #4d7a54;
            --text-muted: #243d28;
            --danger: #ff2a4b;
            --warning: #ffb700;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'JetBrains Mono', monospace;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(0, 255, 102, 0.05), transparent 60%),
                linear-gradient(rgba(0, 255, 102, 0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 102, 0.015) 1px, transparent 1px);
            background-size: 100% 100%, 20px 20px, 20px 20px;
        }

        /* Header Navigation */
        header {
            height: 52px;
            background: rgba(2, 5, 3, 0.95);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 100;
        }

        .brand-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand {
            font-weight: 800;
            letter-spacing: 2px;
            color: var(--accent);
            text-shadow: 0 0 12px var(--accent-glow);
        }

        .brand-badge {
            font-size: 0.6rem;
            background: rgba(0, 255, 102, 0.1);
            border: 1px solid var(--border);
            padding: 2px 6px;
            border-radius: 3px;
            color: var(--accent);
        }

        .top-stats {
            display: flex;
            gap: 24px;
            font-size: 0.72rem;
            color: var(--text-dim);
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stat-val {
            color: var(--accent);
            font-weight: 700;
        }

        /* User & Auth Buttons */
        .user-widget {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .discord-btn {
            background: linear-gradient(135deg, #5865F2, #4752C4);
            color: #fff;
            padding: 7px 14px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
            box-shadow: 0 0 10px rgba(88, 101, 242, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .discord-btn:hover {
            box-shadow: 0 0 18px rgba(88, 101, 242, 0.6);
            transform: translateY(-1px);
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            padding: 4px 10px;
            border-radius: 5px;
        }

        .user-profile img {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 1px solid var(--accent);
        }

        /* Workspace */
        .workspace {
            flex: 1;
            display: grid;
            grid-template-columns: 260px 1fr 340px;
            overflow: hidden;
        }

        .sidebar {
            background: var(--bg-surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }

        .section-title {
            padding: 12px 16px;
            font-size: 0.68rem;
            font-weight: 700;
            color: var(--text-dim);
            letter-spacing: 1.5px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .vault-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .vault-card {
            background: var(--bg-input);
            border: 1px solid var(--border);
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .vault-card:hover, .vault-card.active {
            border-color: var(--border-bright);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .vault-card-title {
            font-size: 0.78rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 4px;
        }

        .vault-card-meta {
            font-size: 0.65rem;
            color: var(--text-dim);
            display: flex;
            justify-content: space-between;
        }

        /* Center Main Editor */
        .editor-container {
            display: flex;
            flex-direction: column;
            background: var(--bg-base);
            border-right: 1px solid var(--border);
        }

        .editor-tabs {
            height: 36px;
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
        }

        .tab {
            padding: 0 16px;
            height: 100%;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.75rem;
            color: var(--text-dim);
            border-right: 1px solid var(--border);
            background: rgba(0, 0, 0, 0.2);
            cursor: pointer;
        }

        .tab.active {
            background: var(--bg-base);
            color: var(--accent);
            border-bottom: 2px solid var(--accent);
        }

        .editor-workspace {
            flex: 1;
            position: relative;
            display: flex;
            overflow: hidden;
        }

        .line-numbers {
            width: 48px;
            padding: 14px 0;
            background: rgba(0, 0, 0, 0.4);
            border-right: 1px solid var(--border);
            color: var(--text-muted);
            font-size: 0.8rem;
            line-height: 1.5;
            text-align: right;
            padding-right: 10px;
            user-select: none;
        }

        .code-view {
            position: relative;
            flex: 1;
        }

        textarea, pre {
            position: absolute;
            inset: 0;
            margin: 0;
            padding: 14px;
            font-size: 0.82rem;
            line-height: 1.5;
            tab-size: 4;
            white-space: pre;
            overflow: auto;
            border: none;
            outline: none;
            background: transparent;
        }

        textarea {
            color: transparent;
            caret-color: var(--accent);
            z-index: 2;
            resize: none;
        }

        pre {
            z-index: 1;
            pointer-events: none;
        }

        /* Console */
        .console-panel {
            height: 180px;
            background: var(--bg-surface);
            border-top: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }

        .console-header {
            padding: 6px 12px;
            font-size: 0.68rem;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid var(--border);
            color: var(--text-dim);
            display: flex;
            justify-content: space-between;
        }

        .console-logs {
            flex: 1;
            padding: 10px;
            font-size: 0.72rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .log-entry {
            display: flex;
            gap: 8px;
        }

        .log-time { color: var(--text-muted); }
        .log-info { color: var(--text-main); }
        .log-success { color: var(--accent); }
        .log-warn { color: var(--warning); }

        /* Controls */
        .config-panel {
            background: var(--bg-surface);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            overflow-y: auto;
        }

        .config-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .config-group label {
            font-size: 0.68rem;
            color: var(--text-dim);
            letter-spacing: 1px;
        }

        input[type="text"], select {
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 10px;
            border-radius: 5px;
            font-size: 0.78rem;
            outline: none;
        }

        input[type="text"]:focus, select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 8px var(--accent-glow);
        }

        .toggle-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .toggle-item {
            background: var(--bg-input);
            border: 1px solid var(--border);
            padding: 8px 12px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.72rem;
            cursor: pointer;
        }

        .toggle-item input { accent-color: var(--accent); }

        .btn-deploy {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 14px;
            border-radius: 6px;
            font-weight: 800;
            font-size: 0.85rem;
            cursor: pointer;
            letter-spacing: 1px;
            text-transform: uppercase;
            box-shadow: 0 0 20px var(--accent-glow);
            transition: all 0.2s;
            margin-top: auto;
        }

        .btn-deploy:hover {
            background: #00cc52;
            box-shadow: 0 0 30px var(--accent-glow);
            transform: translateY(-1px);
        }

        footer {
            height: 24px;
            background: #000;
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            font-size: 0.65rem;
            color: var(--text-dim);
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-group">
            <span class="brand">ERROR404</span>
            <span class="brand-badge">v5.0 PRO</span>
        </div>

        <div class="top-stats">
            <div class="stat-item">ENGINE: <span class="stat-val">LUAU JIT</span></div>
            <div class="stat-item">SECURITY: <span class="stat-val">MAXIMUM</span></div>
        </div>

        <!-- Discord Login Container -->
        <div class="user-widget" id="userWidget">
            <a href="/auth/discord" class="discord-btn">
                <span>Login with Discord</span>
            </a>
        </div>
    </header>

    <div class="workspace">
        <div class="sidebar">
            <div class="section-title">
                <span>DEPLOYED VAULT</span>
                <span style="cursor: pointer;" onclick="loadVault()">[REFRESH]</span>
            </div>
            <div class="vault-scroll" id="vaultList">
                <div class="vault-card active">
                    <div class="vault-card-title">Rayfield UI Engine</div>
                    <div class="vault-card-meta">
                        <span>LUAU</span>
                        <span>2 mins ago</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="editor-container">
            <div class="editor-tabs">
                <div class="tab active">// main.luau</div>
                <div class="tab" onclick="clearEditor()">+ New Script</div>
            </div>
            <div class="editor-workspace">
                <div class="line-numbers" id="lineNumbers">1</div>
                <div class="code-view">
                    <textarea id="scriptInput" spellcheck="false" placeholder="-- Paste Luau script here..."></textarea>
                    <pre><code class="language-lua" id="highlightArea"></code></pre>
                </div>
            </div>
            <div class="console-panel">
                <div class="console-header">
                    <span>EXECUTION LOGS</span>
                    <span style="cursor: pointer;" onclick="clearConsole()">CLEAR</span>
                </div>
                <div class="console-logs" id="consoleLogs">
                    <div class="log-entry"><span class="log-time">[00:00:00]</span><span class="log-info">System initialized. Ready for obfuscation pipeline.</span></div>
                </div>
            </div>
        </div>

        <div class="config-panel">
            <div class="config-group">
                <label>SCRIPT NAME</label>
                <input type="text" id="scriptName" placeholder="Universal Script">
            </div>

            <div class="config-group">
                <label>TARGET ENVIRONMENT</label>
                <select id="fileType">
                    <option value="luau">Roblox Luau (JIT Optimized)</option>
                    <option value="lua">Standard Lua 5.1</option>
                </select>
            </div>

            <div class="config-group">
                <label>PROTECTION PIPELINE</label>
                <div class="toggle-grid">
                    <label class="toggle-item">
                        <span>VM Virtualization</span>
                        <input type="checkbox" id="optVM" checked>
                    </label>
                    <label class="toggle-item">
                        <span>String Encryption</span>
                        <input type="checkbox" id="optEncryptStrings" checked>
                    </label>
                    <label class="toggle-item">
                        <span>Control Flow Flattening</span>
                        <input type="checkbox" id="optCFlow" checked>
                    </label>
                    <label class="toggle-item">
                        <span>Anti-Tamper & Hook Check</span>
                        <input type="checkbox" id="optAntiTamper" checked>
                    </label>
                </div>
            </div>

            <button class="btn-deploy" onclick="deployScript()">COMPILE & DEPLOY</button>
        </div>
    </div>

    <footer>
        <div>STATUS: CONNECTED</div>
        <div id="charCount">0 CHARS | 1 LINE</div>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-lua.min.js"></script>
    <script>
        const scriptInput = document.getElementById('scriptInput');
        const highlightArea = document.getElementById('highlightArea');
        const lineNumbers = document.getElementById('lineNumbers');
        const charCount = document.getElementById('charCount');

        function updateEditor() {
            const val = scriptInput.value;
            highlightArea.textContent = val + '\n';
            Prism.highlightElement(highlightArea);

            const lines = val.split('\n').length;
            lineNumbers.innerHTML = Array.from({ length: lines }, (_, i) => i + 1).join('<br>');
            charCount.innerText = `${val.length} CHARS | ${lines} LINES`;

            highlightArea.parentElement.scrollTop = scriptInput.scrollTop;
            highlightArea.parentElement.scrollLeft = scriptInput.scrollLeft;
            lineNumbers.scrollTop = scriptInput.scrollTop;
        }

        async function checkUser() {
            try {
                const res = await fetch('/api/me');
                const data = await res.json();
                const widget = document.getElementById('userWidget');
                if (data.authenticated) {
                    widget.innerHTML = `
                        <div class="user-profile">
                            <img src="${data.user.avatar}" alt="Avatar">
                            <span style="font-size: 0.75rem; font-weight: 600;">${data.user.username}</span>
                            <a href="/auth/logout" style="color: var(--danger); font-size: 0.68rem; text-decoration: none; margin-left: 4px;">[LOGOUT]</a>
                        </div>
                    `;
                } else {
                    widget.innerHTML = `
                        <a href="/auth/discord" class="discord-btn">
                            <span>Login with Discord</span>
                        </a>
                    `;
                }
            } catch (e) {
                console.log("Auth endpoint unavailable (running offline/preview)");
            }
        }

        function logConsole(msg, type = 'info') {
            const logs = document.getElementById('consoleLogs');
            const time = new Date().toLocaleTimeString();
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerHTML = `<span class="log-time">[${time}]</span><span class="log-${type}">${msg}</span>`;
            logs.appendChild(entry);
            logs.scrollTop = logs.scrollHeight;
        }

        function clearConsole() {
            document.getElementById('consoleLogs').innerHTML = '';
        }

        function clearEditor() {
            scriptInput.value = '';
            updateEditor();
            logConsole('Editor cleared.', 'warn');
        }

        scriptInput.addEventListener('input', updateEditor);
        scriptInput.addEventListener('scroll', () => {
            highlightArea.parentElement.scrollTop = scriptInput.scrollTop;
            highlightArea.parentElement.scrollLeft = scriptInput.scrollLeft;
            lineNumbers.scrollTop = scriptInput.scrollTop;
        });

        async function deployScript() {
            if (!scriptInput.value.trim()) {
                logConsole('Error: Source script cannot be empty.', 'warn');
                return;
            }
            logConsole('Starting obfuscation & payload build...', 'info');
            setTimeout(() => {
                logConsole('Compiled successfully! Payload deployed to vault.', 'success');
            }, 600);
        }

        checkUser();
        updateEditor();
    </script>
</body>
</html>
