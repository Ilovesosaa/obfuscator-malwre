<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nix6 Obfuscator // Next-Gen Luau Security Engine</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,600;0,800;1,400&family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #000000;
            --bg-surface: rgba(12, 12, 12, 0.95);
            --bg-card: rgba(18, 18, 18, 0.95);
            --bg-input: #050505;
            
            --border-subtle: rgba(255, 255, 255, 0.12);
            --border-hover: rgba(255, 255, 255, 0.45);
            
            --accent-white: #ffffff;
            --accent-glow: rgba(255, 255, 255, 0.25);
            
            --text-primary: #ffffff;
            --text-secondary: #a1a1aa;
            --text-dim: #52525b;
            
            --danger: #ffffff;
            --danger-bg: rgba(255, 255, 255, 0.08);
            
            --radius-main: 12px;
            --radius-inner: 8px;
            --transition-fast: 0.15s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'JetBrains Mono', monospace;
            transition: border-color var(--transition-fast), box-shadow var(--transition-fast), background var(--transition-fast), transform var(--transition-fast);
        }

        /* Custom Scrollbars */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #000000; }
        ::-webkit-scrollbar-thumb { background: var(--border-subtle); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent-white); }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
        }

        /* Subtle Grid Pattern */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: 
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 32px 32px;
            pointer-events: none;
            z-index: 0;
        }

        /* Header Navigation */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 48px;
            border-bottom: 1px solid var(--border-subtle);
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(20px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 1.5rem;
            font-weight: 900;
            color: #fff;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-highlight {
            color: #ffffff;
            text-shadow: 0 0 16px var(--accent-glow);
        }

        .logo-badge {
            font-size: 0.65rem;
            color: #ffffff;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border-subtle);
            padding: 4px 10px;
            border-radius: 20px;
            letter-spacing: 2px;
            font-weight: 800;
        }

        .user-widget { display: flex; align-items: center; gap: 12px; }
        .auth-btn-group { display: flex; align-items: center; gap: 12px; }

        .discord-btn {
            background: #ffffff;
            color: #000000;
            padding: 10px 22px;
            border-radius: var(--radius-inner);
            text-decoration: none;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 800;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .discord-btn:hover { background: #e4e4e7; transform: translateY(-1px); }

        .key-auth-btn {
            background: rgba(255, 255, 255, 0.05);
            color: #ffffff;
            border: 1px solid var(--border-subtle);
            padding: 10px 20px;
            border-radius: var(--radius-inner);
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 800;
            font-size: 0.8rem;
            cursor: pointer;
        }
        .key-auth-btn:hover { border-color: var(--accent-white); background: rgba(255, 255, 255, 0.1); }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            padding: 6px 16px 6px 8px;
            border-radius: 40px;
        }

        .user-profile img, .user-avatar-key {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 1px solid var(--accent-white);
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            font-weight: 800;
            font-size: 0.75rem;
        }

        .logout-btn { color: var(--text-secondary); text-decoration: none; font-size: 0.75rem; font-weight: 700; cursor: pointer; margin-left: 6px; }
        .logout-btn:hover { color: #ffffff; }

        /* Top HUD Bar */
        .hud-bar {
            max-width: 1440px;
            width: 100%;
            margin: 24px auto 0;
            padding: 0 24px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            z-index: 1;
        }

        .hud-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-inner);
            padding: 18px 20px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .hud-label { font-size: 0.65rem; color: var(--text-dim); font-weight: 700; letter-spacing: 1.5px; }
        .hud-value { font-size: 1.1rem; color: #ffffff; font-weight: 800; }

        /* Main Workspace Grid */
        main {
            flex: 1;
            max-width: 1440px;
            width: 100%;
            margin: 0 auto;
            padding: 24px;
            display: grid;
            grid-template-columns: 1fr 420px;
            gap: 24px;
            position: relative;
            z-index: 1;
        }

        .card {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-main);
            padding: 32px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
            margin-bottom: 24px;
            position: relative;
        }

        h2 {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.95rem;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 22px;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .input-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }
        label { font-size: 0.7rem; color: var(--text-secondary); letter-spacing: 1.5px; font-weight: 700; text-transform: uppercase; }

        input[type="text"], input[type="password"], select, textarea {
            background: var(--bg-input);
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
            padding: 14px 18px;
            border-radius: var(--radius-inner);
            outline: none;
            font-size: 0.85rem;
        }

        input[type="text"]:focus, input[type="password"]:focus, select:focus, textarea:focus {
            border-color: var(--accent-white);
            box-shadow: 0 0 12px var(--accent-glow);
        }

        /* Monochrome IDE Layout */
        .ide-wrapper {
            position: relative;
            background: var(--bg-input);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-inner);
            overflow: hidden;
        }

        .ide-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 18px;
            background: rgba(20, 20, 20, 0.6);
            border-bottom: 1px solid var(--border-subtle);
            font-size: 0.72rem;
            color: var(--text-dim);
        }

        textarea.ide-textarea {
            width: 100%;
            border: none;
            background: transparent;
            min-height: 380px;
            color: #ffffff;
            resize: vertical;
            line-height: 1.6;
            padding: 18px;
            border-radius: 0;
            font-size: 0.85rem;
        }
        textarea.ide-textarea:focus { box-shadow: none; }

        /* Options Grid */
        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }
        .option-toggle {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-subtle);
            padding: 12px 14px;
            border-radius: var(--radius-inner);
            cursor: pointer;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }
        .option-toggle:hover { border-color: var(--accent-white); color: #ffffff; }
        .option-toggle input[type="checkbox"] { accent-color: #ffffff; cursor: pointer; }

        .btn-primary {
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 14px 32px;
            border-radius: var(--radius-inner);
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 800;
            font-size: 0.85rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn-primary:hover { background: #e4e4e7; transform: translateY(-1px); }

        .icon-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
            padding: 8px 16px;
            border-radius: var(--radius-inner);
            cursor: pointer;
            font-size: 0.78rem;
            font-weight: 700;
        }
        .icon-btn:hover { background: rgba(255, 255, 255, 0.12); border-color: var(--accent-white); }

        .icon-btn.delete { background: var(--danger-bg); border-color: var(--border-subtle); color: #ffffff; }
        .icon-btn.delete:hover { background: rgba(255, 255, 255, 0.2); border-color: #ffffff; }

        .loader-link {
            color: var(--text-dim);
            background-color: #000000;
            user-select: none;
            cursor: pointer;
            word-break: break-all;
            font-size: 0.8rem;
            margin: 12px 0;
            padding: 14px;
            border: 1px dashed var(--border-subtle);
            border-radius: var(--radius-inner);
            display: block;
        }
        .loader-link.revealed { color: #ffffff; user-select: text; border-style: solid; border-color: var(--accent-white); }

        .vault-list { display: flex; flex-direction: column; gap: 14px; max-height: 560px; overflow-y: auto; padding-right: 4px; }
        .vault-item {
            background: rgba(5, 5, 5, 0.95);
            border: 1px solid var(--border-subtle);
            padding: 18px;
            border-radius: var(--radius-inner);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .vault-item:hover { border-color: var(--border-hover); }

        .owner-panel {
            grid-column: 1 / -1;
            background: var(--bg-surface);
            border: 1px solid var(--accent-white);
            display: none;
        }
        .owner-panel.active { display: block; }
        .owner-panel h2 { color: #ffffff; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(10px);
            display: none; justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-overlay.active { display: flex; }
        .modal-card { background: var(--bg-card); border: 1px solid var(--accent-white); border-radius: var(--radius-main); padding: 32px; width: 100%; max-width: 440px; }

        @media (max-width: 960px) {
            main { grid-template-columns: 1fr; }
            .hud-bar { grid-template-columns: repeat(2, 1fr); }
            header { padding: 16px 20px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            NIX<span class="logo-highlight">6</span> 
            <span class="logo-badge">ENGINE V3</span>
        </div>
        <div class="user-widget" id="userWidget"></div>
    </header>

    <!-- Top System Analytics HUD -->
    <div class="hud-bar">
        <div class="hud-card">
            <span class="hud-label">ENGINE STATUS</span>
            <span class="hud-value">ONLINE</span>
        </div>
        <div class="hud-card">
            <span class="hud-label">HOSTED VAULT SCRIPTS</span>
            <span class="hud-value" id="hudScriptCount">0</span>
        </div>
        <div class="hud-card">
            <span class="hud-label">SYSTEM API KEYS</span>
            <span class="hud-value" id="hudKeyCount">ACTIVE</span>
        </div>
        <div class="hud-card">
            <span class="hud-label">SERVER LATENCY</span>
            <span class="hud-value">12ms</span>
        </div>
    </div>

    <main>
        <!-- Owner Admin Dashboard (Only renders for Owner Discord ID) -->
        <div class="card owner-panel" id="ownerPanel">
            <h2><span>⚡</span> ADMIN CONTROL SYSTEM (KEY MANAGEMENT)</h2>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px;">
                <div>
                    <div class="input-group">
                        <label>CLIENT IDENTIFIER / NAME</label>
                        <input type="text" id="targetUsername" placeholder="e.g. VIP_Subscriber">
                    </div>
                    <button class="btn-primary" onclick="adminGenerateKey()">Generate Key</button>
                </div>
                <div>
                    <label>GENERATED API KEY</label>
                    <input type="text" id="generatedKeyOutput" readonly placeholder="Key output..." style="width: 100%; margin-top: 8px;">
                    <button class="icon-btn" style="margin-top: 12px;" onclick="copyGeneratedKey()">Copy Key</button>
                </div>
            </div>
            
            <div style="margin-top: 28px;">
                <label>ACTIVE SYSTEM KEYS</label>
                <div id="activeKeysList" style="margin-top: 12px; max-height: 220px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px;">
                </div>
            </div>
        </div>

        <!-- Main Obfuscation Engine -->
        <div class="card">
            <h2><span>⚙️</span> NIX6 SOURCE COMPILER & OBFUSCATOR</h2>
            <div class="editor-container">
                <input type="hidden" id="editId" value="">
                
                <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 16px;">
                    <div class="input-group">
                        <label>SCRIPT IDENTIFIER</label>
                        <input type="text" id="scriptName" placeholder="e.g. Rayfield UI / Custom Script">
                    </div>
                    <div class="input-group">
                        <label>ENVIRONMENT</label>
                        <select id="fileType">
                            <option value="luau">Luau (Roblox Studio)</option>
                            <option value="lua">Standard Lua 5.1</option>
                        </select>
                    </div>
                </div>

                <label style="margin-bottom: 8px; display: block;">PROTECTION MATRIX</label>
                <div class="options-grid">
                    <label class="option-toggle"><input type="checkbox" checked id="optMinify"> Minify Code</label>
                    <label class="option-toggle"><input type="checkbox" checked id="optRename"> Rename Variables</label>
                    <label class="option-toggle"><input type="checkbox" checked id="optEncrypt"> Encrypt Strings</label>
                    <label class="option-toggle"><input type="checkbox" id="optAntiTamper"> Anti-Tamper Shield</label>
                </div>

                <div class="input-group">
                    <label>LUAU / LUA SOURCE CODE</label>
                    <div class="ide-wrapper">
                        <div class="ide-header">
                            <span>MAIN.LUAU</span>
                            <span id="charCount">0 lines | 0 chars</span>
                        </div>
                        <textarea class="ide-textarea" id="scriptInput" oninput="updateEditorStats()" placeholder="-- Paste your source code or UI library here..."></textarea>
                    </div>
                </div>

                <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 16px;">
                    <span id="statusMsg" style="font-size: 0.8rem; color: #ffffff; font-weight: 600;"></span>
                    <button class="btn-primary" onclick="deployScript()">Compile & Deploy</button>
                </div>

                <div class="output-box" id="outputBox" style="display:none; margin-top: 24px;">
                    <label>GENERATED LOADSTRING:</label>
                    <code class="loader-link" id="loaderOutput" onclick="toggleReveal(this)"></code>
                    <button class="icon-btn" onclick="copyLoader()">Copy Loadstring</button>
                </div>
            </div>
        </div>

        <!-- Script Vault -->
        <div class="card">
            <h2><span>📦</span> ENCRYPTED VAULT</h2>
            <div class="vault-list" id="vaultList">
                <div style="color: var(--text-dim); font-size: 0.85rem; text-align: center; padding: 30px;">
                    Login to inspect your hosted scripts.
                </div>
            </div>
        </div>
    </main>

    <!-- Key Login Modal -->
    <div class="modal-overlay" id="keyModal">
        <div class="modal-card">
            <h2 style="margin-bottom: 16px;">🔑 AUTHENTICATE KEY</h2>
            <div class="input-group">
                <label>API KEY</label>
                <input type="password" id="apiKeyInput" placeholder="nix6_key_xxxxxxxxxxxxx">
            </div>
            <div style="display: flex; gap: 12px; justify-content: flex-end; margin-top: 20px;">
                <button class="icon-btn" onclick="closeKeyModal()">Cancel</button>
                <button class="btn-primary" style="padding: 10px 22px;" onclick="saveApiKey()">Authorize</button>
            </div>
        </div>
    </div>

    <script>
        const OWNER_DISCORD_ID = "1257596807857569793";
        let currentApiKey = localStorage.getItem('nix6_api_key') || null;

        function updateEditorStats() {
            const txt = document.getElementById('scriptInput').value;
            const lines = txt ? txt.split('\n').length : 0;
            document.getElementById('charCount').innerText = `${lines} lines | ${txt.length} chars`;
        }

        async function checkUser() {
            try {
                if (currentApiKey) {
                    const res = await fetch('/api/verify-key', { headers: { 'X-API-Key': currentApiKey } });
                    const data = await res.json();
                    if (data.authenticated) {
                        renderUserWidget({ username: data.username || 'API User', type: 'key' });
                        loadVault();
                        return;
                    } else {
                        localStorage.removeItem('nix6_api_key');
                        currentApiKey = null;
                    }
                }

                const res = await fetch('/api/me');
                const data = await res.json();
                if (data.authenticated) {
                    renderUserWidget({ ...data.user, type: 'discord' });
                    
                    if (data.user.id === OWNER_DISCORD_ID) {
                        document.getElementById('ownerPanel').classList.add('active');
                        loadAdminKeys();
                    }
                    loadVault();
                } else {
                    renderLoggedOutWidget();
                }
            } catch (e) {
                renderLoggedOutWidget();
            }
        }

        function renderUserWidget(user) {
            const widget = document.getElementById('userWidget');
            const avatarHtml = user.type === 'discord' 
                ? `<img src="${user.avatar}" alt="Avatar">`
                : `<div class="user-avatar-key">KEY</div>`;

            widget.innerHTML = `
                <div class="user-profile">
                    ${avatarHtml}
                    <span style="font-size: 0.85rem; font-weight: 700;">${user.username}</span>
                    <a onclick="logout()" class="logout-btn">[LOGOUT]</a>
                </div>
            `;
        }

        function renderLoggedOutWidget() {
            document.getElementById('userWidget').innerHTML = `
                <div class="auth-btn-group">
                    <button class="key-auth-btn" onclick="openKeyModal()">API Key</button>
                    <a href="/auth/discord" class="discord-btn">Discord Login</a>
                </div>
            `;
        }

        async function adminGenerateKey() {
            const targetUsername = document.getElementById('targetUsername').value.trim() || "User_Key";
            const res = await fetch('/api/admin/generate-key', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: targetUsername })
            });
            const data = await res.json();
            if (data.success) {
                document.getElementById('generatedKeyOutput').value = data.apiKey;
                loadAdminKeys();
            } else {
                alert('Error: ' + data.error);
            }
        }

        async function loadAdminKeys() {
            const res = await fetch('/api/admin/keys');
            const data = await res.json();
            if (data.success) {
                document.getElementById('hudKeyCount').innerText = data.keys.length;
                const list = document.getElementById('activeKeysList');
                list.innerHTML = data.keys.map(k => `
                    <div style="background: rgba(0,0,0,0.8); padding: 10px 14px; border-radius: var(--radius-inner); border: 1px solid var(--border-subtle); display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem;">
                        <span><strong style="color:#ffffff;">${k.username}:</strong> <code>${k.key}</code></span>
                        <button class="icon-btn delete" onclick="revokeKey('${k.key}')">Revoke</button>
                    </div>
                `).join('');
            }
        }

        async function revokeKey(key) {
            if (!confirm("Revoke this Key?")) return;
            await fetch('/api/admin/revoke-key', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ key })
            });
            loadAdminKeys();
        }

        function copyGeneratedKey() {
            const val = document.getElementById('generatedKeyOutput').value;
            if (val) {
                navigator.clipboard.writeText(val);
                alert("Key copied to clipboard!");
            }
        }

        function openKeyModal() { document.getElementById('keyModal').classList.add('active'); }
        function closeKeyModal() { document.getElementById('keyModal').classList.remove('active'); }

        function saveApiKey() {
            const key = document.getElementById('apiKeyInput').value.trim();
            if (key) {
                localStorage.setItem('nix6_api_key', key);
                currentApiKey = key;
                closeKeyModal();
                checkUser();
            }
        }

        function logout() {
            localStorage.removeItem('nix6_api_key');
            currentApiKey = null;
            window.location.href = '/auth/logout';
        }

        function getAuthHeaders() {
            const headers = { 'Content-Type': 'application/json' };
            if (currentApiKey) headers['X-API-Key'] = currentApiKey;
            return headers;
        }

        function safeBase64Encode(str) {
            const bytes = new TextEncoder().encode(str);
            let binString = "";
            for (let i = 0; i < bytes.length; i++) binString += String.fromCharCode(bytes[i]);
            return btoa(binString);
        }

        async function deployScript() {
            const scriptName = document.getElementById('scriptName').value;
            const fileType = document.getElementById('fileType').value;
            const scriptInput = document.getElementById('scriptInput').value;
            const editId = document.getElementById('editId').value;
            const statusMsg = document.getElementById('statusMsg');

            if (!scriptInput.trim()) return alert('Script body cannot be empty.');

            statusMsg.innerText = 'Compiling Payload...';
            try {
                const payload = safeBase64Encode(scriptInput);
                const res = await fetch('/api/obfuscate', {
                    method: 'POST',
                    headers: getAuthHeaders(),
                    body: JSON.stringify({ scriptPayload: payload, scriptName, fileType, editId })
                });
                const data = await res.json();
                if (data.success) {
                    statusMsg.innerText = 'Deployment Complete!';
                    document.getElementById('outputBox').style.display = 'block';
                    document.getElementById('loaderOutput').innerText = data.loader;
                    loadVault();
                } else {
                    statusMsg.innerText = 'Error: ' + data.error;
                }
            } catch (err) {
                statusMsg.innerText = 'Network error during build.';
            }
        }

        async function loadVault() {
            try {
                const res = await fetch('/api/vault', { headers: getAuthHeaders() });
                const data = await res.json();
                const vaultList = document.getElementById('vaultList');
                if (!data.success || !data.scripts || data.scripts.length === 0) {
                    document.getElementById('hudScriptCount').innerText = '0';
                    vaultList.innerHTML = `<div style="color: var(--text-dim); font-size: 0.85rem; text-align: center; padding: 30px;">Vault is currently empty.</div>`;
                    return;
                }

                document.getElementById('hudScriptCount').innerText = data.scripts.length;
                vaultList.innerHTML = data.scripts.map(s => `
                    <div class="vault-item">
                        <div style="display:flex; justify-content: space-between; align-items: center;">
                            <div>
                                <strong style="color:#fff; font-size:0.9rem;">${s.name}</strong>
                                <div style="font-size:0.7rem; color:var(--text-dim); margin-top:2px;">${s.fileType.toUpperCase()}</div>
                            </div>
                            <div>
                                <button class="icon-btn delete" onclick="deleteScript('${s.id}')">Delete</button>
                            </div>
                        </div>
                        <code class="loader-link" onclick="toggleReveal(this)">${s.loader}</code>
                    </div>
                `).join('');
            } catch (e) {}
        }

        async function deleteScript(id) {
            if (!confirm('Delete this script permanently?')) return;
            await fetch('/api/delete', { method: 'POST', headers: getAuthHeaders(), body: JSON.stringify({ id }) });
            loadVault();
        }

        function toggleReveal(el) { el.classList.toggle('revealed'); }
        function copyLoader() { navigator.clipboard.writeText(document.getElementById('loaderOutput').innerText); alert('Copied to clipboard!'); }

        checkUser();
    </script>
</body>
</html>
