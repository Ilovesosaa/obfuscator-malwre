<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error404 | Secure Luau Obfuscator & Host</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #030604;
            --bg-surface: rgba(10, 18, 12, 0.7);
            --bg-input: rgba(4, 10, 6, 0.85);
            --border-glow: rgba(0, 255, 128, 0.25);
            --border-hover: rgba(0, 255, 128, 0.6);
            --accent-green: #00ff80;
            --accent-cyan: #00f0ff;
            --accent-glow: rgba(0, 255, 128, 0.4);
            --text-primary: #ecfdf5;
            --text-secondary: #6ee7b7;
            --text-dim: #34d39988;
            --danger: #ff3366;
            --danger-glow: rgba(255, 51, 102, 0.4);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Fira Code', monospace; }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: 
                radial-gradient(circle at 20% 10%, rgba(0, 255, 128, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 80% 90%, rgba(0, 240, 255, 0.05) 0%, transparent 40%),
                linear-gradient(rgba(0, 255, 128, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 128, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 40px 40px, 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 48px;
            border-bottom: 1px solid var(--border-glow);
            background: rgba(3, 6, 4, 0.85);
            backdrop-filter: blur(20px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 1.5rem;
            font-weight: 800;
            color: #fff;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-highlight { color: var(--accent-green); text-shadow: 0 0 15px var(--accent-glow); }
        .logo-badge {
            font-size: 0.65rem;
            color: var(--accent-green);
            background: rgba(0, 255, 128, 0.1);
            border: 1px solid var(--accent-green);
            padding: 4px 10px;
            border-radius: 20px;
        }

        .user-widget { display: flex; align-items: center; gap: 12px; }
        .auth-btn-group { display: flex; align-items: center; gap: 10px; }

        .discord-btn {
            background: linear-gradient(135deg, #5865F2 0%, #3b42cc 100%);
            color: #fff;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 700;
            font-size: 0.82rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .key-auth-btn {
            background: rgba(0, 255, 128, 0.08);
            color: var(--accent-green);
            border: 1px solid var(--accent-green);
            padding: 10px 18px;
            border-radius: 8px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 700;
            font-size: 0.82rem;
            cursor: pointer;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--bg-surface);
            border: 1px solid var(--border-glow);
            padding: 6px 18px;
            border-radius: 40px;
        }

        .user-profile img, .user-avatar-key {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 2px solid var(--accent-green);
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 255, 128, 0.1);
            color: var(--accent-green);
            font-weight: 700;
            font-size: 0.75rem;
        }

        .logout-btn { color: var(--danger); text-decoration: none; font-size: 0.75rem; font-weight: 700; cursor: pointer; margin-left: 6px; }

        main {
            flex: 1;
            max-width: 1320px;
            width: 100%;
            margin: 0 auto;
            padding: 40px 24px;
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 32px;
            position: relative;
            z-index: 1;
        }

        .card {
            background: var(--bg-surface);
            border: 1px solid var(--border-glow);
            border-radius: 16px;
            padding: 32px;
            backdrop-filter: blur(16px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            margin-bottom: 24px;
        }

        h2 {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 1rem;
            font-weight: 800;
            color: var(--accent-green);
            margin-bottom: 20px;
            letter-spacing: 2px;
            text-shadow: 0 0 10px var(--accent-glow);
        }

        .input-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
        label { font-size: 0.75rem; color: var(--text-secondary); letter-spacing: 1px; font-weight: 600; text-transform: uppercase; }

        input[type="text"], input[type="password"], select, textarea {
            background: var(--bg-input);
            border: 1px solid var(--border-glow);
            color: var(--text-primary);
            padding: 14px 18px;
            border-radius: 10px;
            outline: none;
            font-size: 0.88rem;
        }

        textarea { min-height: 280px; color: #00ffaa; resize: vertical; }

        .btn-primary {
            background: linear-gradient(135deg, #00ff80 0%, #00b359 100%);
            color: #020603;
            border: none;
            padding: 14px 32px;
            border-radius: 10px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 800;
            font-size: 0.88rem;
            cursor: pointer;
            text-transform: uppercase;
        }

        .icon-btn {
            background: rgba(0, 255, 128, 0.06);
            border: 1px solid var(--border-glow);
            color: var(--text-primary);
            padding: 7px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.78rem;
            font-weight: 600;
        }

        .icon-btn.delete { background: rgba(255, 51, 102, 0.06); border-color: rgba(255, 51, 102, 0.25); color: var(--danger); }

        .loader-link {
            color: transparent;
            background-color: #020503;
            text-shadow: 0 0 12px rgba(0, 255, 128, 0.3);
            user-select: none;
            cursor: pointer;
            word-break: break-all;
            font-size: 0.82rem;
            margin: 12px 0;
            padding: 14px;
            border: 1px dashed var(--border-glow);
            border-radius: 8px;
            display: block;
        }

        .loader-link.revealed { color: var(--accent-green); text-shadow: none; user-select: text; border-style: solid; }

        .vault-list { display: flex; flex-direction: column; gap: 14px; max-height: 500px; overflow-y: auto; }
        .vault-item { background: rgba(2, 6, 3, 0.8); border: 1px solid var(--border-glow); padding: 16px; border-radius: 12px; display: flex; flex-direction: column; gap: 12px; }

        /* Owner Control Panel Styling */
        .owner-panel {
            grid-column: 1 / -1;
            background: rgba(12, 6, 20, 0.8);
            border: 1px solid var(--accent-cyan);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.2);
            display: none;
        }

        .owner-panel.active { display: block; }
        .owner-panel h2 { color: var(--accent-cyan); text-shadow: 0 0 10px rgba(0, 240, 255, 0.5); }

        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(12px);
            display: none; justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-overlay.active { display: flex; }
        .modal-card { background: var(--bg-surface); border: 1px solid var(--accent-green); border-radius: 16px; padding: 32px; width: 100%; max-width: 440px; }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            ERROR<span class="logo-highlight">404</span> 
            <span class="logo-badge">OBFUSCATOR</span>
        </div>
        <div class="user-widget" id="userWidget"></div>
    </header>

    <main>
        <!-- Owner Admin Section (Only displays for Discord ID: 1257596807857569793) -->
        <div class="card owner-panel" id="ownerPanel">
            <h2>// OWNER ADMIN PANEL (KEY GENERATOR)</h2>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                <div>
                    <div class="input-group">
                        <label>ASSIGN USERNAME / CLIENT LABEL</label>
                        <input type="text" id="targetUsername" placeholder="e.g. VIP_Buyer_01">
                    </div>
                    <button class="btn-primary" style="background: linear-gradient(135deg, #00f0ff 0%, #0080ff 100%); color: #000;" onclick="adminGenerateKey()">Generate API Key</button>
                </div>
                <div>
                    <label>GENERATED API KEY</label>
                    <input type="text" id="generatedKeyOutput" readonly placeholder="Key will appear here..." style="width: 100%; margin-top: 8px;">
                    <button class="icon-btn" style="margin-top: 10px;" onclick="copyGeneratedKey()">Copy Key</button>
                </div>
            </div>
            
            <div style="margin-top: 24px;">
                <label>ACTIVE KEYS IN SYSTEM</label>
                <div id="activeKeysList" style="margin-top: 10px; max-height: 200px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;">
                    <!-- Active keys populated here -->
                </div>
            </div>
        </div>

        <!-- Script Deployment Card -->
        <div class="card">
            <h2>// SCRIPT DEPLOYMENT ENGINE</h2>
            <div class="editor-container">
                <input type="hidden" id="editId" value="">
                <div class="input-group">
                    <label>SCRIPT NAME</label>
                    <input type="text" id="scriptName" placeholder="e.g. Universal Aimbot / UI Library">
                </div>
                <div class="input-group">
                    <label>LANGUAGE ENVIRONMENT</label>
                    <select id="fileType">
                        <option value="luau">Luau (Roblox Optimized)</option>
                        <option value="lua">Lua 5.1 / Standard</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>SOURCE CODE & UI LIBRARIES</label>
                    <textarea id="scriptInput" placeholder="Paste your script code here..."></textarea>
                </div>
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <span id="statusMsg" style="font-size: 0.8rem; color: var(--accent-green);"></span>
                    <button class="btn-primary" onclick="deployScript()">Obfuscate & Host</button>
                </div>

                <div class="output-box" id="outputBox" style="display:none; margin-top: 15px;">
                    <label>GENERATED LOADSTRING:</label>
                    <code class="loader-link" id="loaderOutput" onclick="toggleReveal(this)"></code>
                    <button class="icon-btn" onclick="copyLoader()">Copy Loadstring</button>
                </div>
            </div>
        </div>

        <!-- Vault Card -->
        <div class="card">
            <h2>// SCRIPT VAULT</h2>
            <div class="vault-list" id="vaultList">
                <div style="color: var(--text-dim); font-size: 0.85rem; text-align: center; padding: 20px;">
                    Authenticate to view your vault.
                </div>
            </div>
        </div>
    </main>

    <!-- Key Login Modal -->
    <div class="modal-overlay" id="keyModal">
        <div class="modal-card">
            <h2>// ENTER API KEY</h2>
            <div class="input-group">
                <label>AUTHENTICATION KEY</label>
                <input type="password" id="apiKeyInput" placeholder="err404_key_xxxxxxxxxxxxx">
            </div>
            <div style="display: flex; gap: 10px; justify-content: flex-end;">
                <button class="icon-btn" onclick="closeKeyModal()">Cancel</button>
                <button class="btn-primary" style="padding: 10px 20px;" onclick="saveApiKey()">Login</button>
            </div>
        </div>
    </div>

    <script>
        const OWNER_DISCORD_ID = "1257596807857569793";
        let currentApiKey = localStorage.getItem('err404_api_key') || null;

        async function checkUser() {
            try {
                // Check stored API Key authentication
                if (currentApiKey) {
                    const res = await fetch('/api/verify-key', { headers: { 'X-API-Key': currentApiKey } });
                    const data = await res.json();
                    if (data.authenticated) {
                        renderUserWidget({ username: data.username || 'API User', type: 'key' });
                        loadVault();
                        return;
                    } else {
                        localStorage.removeItem('err404_api_key');
                        currentApiKey = null;
                    }
                }

                // Check Discord Session
                const res = await fetch('/api/me');
                const data = await res.json();
                if (data.authenticated) {
                    renderUserWidget({ ...data.user, type: 'discord' });
                    
                    // Show Owner Control Panel if Discord ID matches Owner ID
                    if (data.user.id === OWNER_DISCORD_ID) {
                        document.getElementById('ownerPanel').classList.add('active');
                        loadAdminKeys();
                    }
                    loadVault();
                } else {
                    renderLoggedOutWidget();
                }
            } catch (e) {
                renderLoggedOutWidget();
            }
        }

        function renderUserWidget(user) {
            const widget = document.getElementById('userWidget');
            const avatarHtml = user.type === 'discord' 
                ? `<img src="${user.avatar}" alt="Avatar">`
                : `<div class="user-avatar-key">KEY</div>`;

            widget.innerHTML = `
                <div class="user-profile">
                    ${avatarHtml}
                    <span style="font-size: 0.85rem; font-weight: 600;">${user.username}</span>
                    <a onclick="logout()" class="logout-btn">[LOGOUT]</a>
                </div>
            `;
        }

        function renderLoggedOutWidget() {
            document.getElementById('userWidget').innerHTML = `
                <div class="auth-btn-group">
                    <button class="key-auth-btn" onclick="openKeyModal()">API Key</button>
                    <a href="/auth/discord" class="discord-btn">Discord Login</a>
                </div>
            `;
        }

        // Owner API Key Generator Function
        async function adminGenerateKey() {
            const targetUsername = document.getElementById('targetUsername').value.trim() || "User_Key";
            const res = await fetch('/api/admin/generate-key', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: targetUsername })
            });
            const data = await res.json();
            if (data.success) {
                document.getElementById('generatedKeyOutput').value = data.apiKey;
                loadAdminKeys();
            } else {
                alert('Error generating key: ' + data.error);
            }
        }

        async function loadAdminKeys() {
            const res = await fetch('/api/admin/keys');
            const data = await res.json();
            if (data.success) {
                const list = document.getElementById('activeKeysList');
                list.innerHTML = data.keys.map(k => `
                    <div style="background: rgba(0,0,0,0.5); padding: 8px 12px; border-radius: 6px; display: flex; justify-content: space-between; font-size: 0.75rem;">
                        <span><strong>${k.username}:</strong> <code>${k.key}</code></span>
                        <button class="icon-btn delete" onclick="revokeKey('${k.key}')">Revoke</button>
                    </div>
                `).join('');
            }
        }

        async function revokeKey(key) {
            if (!confirm("Revoke this API Key?")) return;
            await fetch('/api/admin/revoke-key', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ key })
            });
            loadAdminKeys();
        }

        function copyGeneratedKey() {
            const val = document.getElementById('generatedKeyOutput').value;
            if (val) {
                navigator.clipboard.writeText(val);
                alert("Key copied to clipboard!");
            }
        }

        function openKeyModal() { document.getElementById('keyModal').classList.add('active'); }
        function closeKeyModal() { document.getElementById('keyModal').classList.remove('active'); }

        function saveApiKey() {
            const key = document.getElementById('apiKeyInput').value.trim();
            if (key) {
                localStorage.setItem('err404_api_key', key);
                currentApiKey = key;
                closeKeyModal();
                checkUser();
            }
        }

        function logout() {
            localStorage.removeItem('err404_api_key');
            currentApiKey = null;
            window.location.href = '/auth/logout';
        }

        function getAuthHeaders() {
            const headers = { 'Content-Type': 'application/json' };
            if (currentApiKey) headers['X-API-Key'] = currentApiKey;
            return headers;
        }

        function safeBase64Encode(str) {
            const bytes = new TextEncoder().encode(str);
            let binString = "";
            for (let i = 0; i < bytes.length; i++) binString += String.fromCharCode(bytes[i]);
            return btoa(binString);
        }

        async function deployScript() {
            const scriptName = document.getElementById('scriptName').value;
            const fileType = document.getElementById('fileType').value;
            const scriptInput = document.getElementById('scriptInput').value;
            const editId = document.getElementById('editId').value;
            const statusMsg = document.getElementById('statusMsg');

            if (!scriptInput.trim()) return alert('Script source cannot be empty');

            statusMsg.innerText = 'Obfuscating...';
            try {
                const payload = safeBase64Encode(scriptInput);
                const res = await fetch('/api/obfuscate', {
                    method: 'POST',
                    headers: getAuthHeaders(),
                    body: JSON.stringify({ scriptPayload: payload, scriptName, fileType, editId })
                });
                const data = await res.json();
                if (data.success) {
                    statusMsg.innerText = 'Deployed!';
                    document.getElementById('outputBox').style.display = 'block';
                    document.getElementById('loaderOutput').innerText = data.loader;
                    loadVault();
                } else {
                    statusMsg.innerText = 'Error: ' + data.error;
                }
            } catch (err) {
                statusMsg.innerText = 'Network error.';
            }
        }

        async function loadVault() {
            try {
                const res = await fetch('/api/vault', { headers: getAuthHeaders() });
                const data = await res.json();
                const vaultList = document.getElementById('vaultList');
                if (!data.success || !data.scripts || data.scripts.length === 0) {
                    vaultList.innerHTML = `<div style="color: var(--text-dim); font-size: 0.85rem; text-align: center; padding: 20px;">No deployed scripts in vault.</div>`;
                    return;
                }
                vaultList.innerHTML = data.scripts.map(s => `
                    <div class="vault-item">
                        <div style="display:flex; justify-shadow: space-between; align-items: center;">
                            <div>
                                <strong style="color:#fff;">${s.name}</strong>
                                <div style="font-size:0.7rem; color:var(--text-dim);">${s.fileType.toUpperCase()}</div>
                            </div>
                            <div>
                                <button class="icon-btn delete" onclick="deleteScript('${s.id}')">Del</button>
                            </div>
                        </div>
                        <code class="loader-link" onclick="toggleReveal(this)">${s.loader}</code>
                    </div>
                `).join('');
            } catch (e) {}
        }

        async function deleteScript(id) {
            if (!confirm('Delete script?')) return;
            await fetch('/api/delete', { method: 'POST', headers: getAuthHeaders(), body: JSON.stringify({ id }) });
            loadVault();
        }

        function toggleReveal(el) { el.classList.toggle('revealed'); }
        function copyLoader() { navigator.clipboard.writeText(document.getElementById('loaderOutput').innerText); alert('Copied!'); }

        checkUser();
    </script>
</body>
</html>
