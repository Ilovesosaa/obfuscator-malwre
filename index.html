<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIN Obfuscator - Hub</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #08080a;
      --card-bg: #111116;
      --card-border: #221c24;
      --accent-red: #ef4444;
      --accent-glow: rgba(239, 68, 68, 0.45);
      --text: #f8fafc;
      --text-sub: #94a3b8;
      --green: #22c55e;
      --discord-btn: #5865F2;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 2rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 950px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .nav-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 1rem 1.5rem;
      border-radius: 12px;
    }

    .brand h1 { font-size: 1.8rem; font-weight: 900; }
    .brand h1 span { color: var(--accent-red); text-shadow: 0 0 20px var(--accent-glow); }

    .user-profile {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .avatar { width: 38px; height: 38px; border-radius: 50%; border: 2px solid var(--accent-red); }
    .username { font-weight: 700; font-size: 0.95rem; }

    .btn-discord {
      background: var(--discord-btn);
      color: #fff;
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.9rem;
      transition: opacity 0.2s;
    }
    .btn-discord:hover { opacity: 0.85; }

    .btn-logout {
      background: #271a1c;
      color: #ef4444;
      border: 1px solid #451a1d;
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .input-group {
      display: flex;
      gap: 1rem;
    }

    input[type="text"] {
      flex: 1;
      background: #0b0b0f;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      color: #fff;
      padding: 0.75rem 1rem;
      outline: none;
    }
    input[type="text"]:focus { border-color: var(--accent-red); }

    textarea {
      width: 100%;
      height: 220px;
      background: #0b0b0f;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      color: #f87171;
      font-family: Consolas, Monaco, monospace;
      font-size: 0.9rem;
      padding: 1rem;
      resize: vertical;
      outline: none;
    }

    .btn-build {
      background: linear-gradient(135deg, #ef4444 0%, #991b1b 100%);
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      padding: 0.85rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 20px var(--accent-glow);
    }

    .output-box {
      display: none;
      flex-direction: column;
      gap: 0.5rem;
      background: #0b0b0f;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 1rem;
    }

    .output-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--green);
    }

    .link-field {
      width: 100%;
      background: #141419;
      border: 1px solid var(--card-border);
      border-radius: 6px;
      color: var(--green);
      font-family: monospace;
      font-size: 0.85rem;
      padding: 0.6rem;
      word-break: break-all;
    }

    .vault-title { font-size: 1.2rem; font-weight: 800; color: var(--text); }

    .script-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .script-item {
      background: #161217;
      border: 1px solid var(--card-border);
      padding: 1rem;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .script-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .script-name { font-weight: 700; color: #f87171; }
    .script-date { font-size: 0.75rem; color: var(--text-sub); }

    .btn-copy-small {
      background: #231924;
      color: #fff;
      border: 1px solid #38253a;
      padding: 0.35rem 0.7rem;
      border-radius: 4px;
      font-size: 0.8rem;
      cursor: pointer;
      align-self: flex-start;
    }

    .locked-notice {
      text-align: center;
      padding: 2rem;
      color: var(--text-sub);
    }
  </style>
</head>
<body>

  <div class="container">
    <nav class="nav-header">
      <div class="brand">
        <h1><span>SIN</span> Obfuscator</h1>
      </div>
      <div id="authContainer">
        <a href="/auth/discord" class="btn-discord">Login with Discord</a>
      </div>
    </nav>

    <main class="card" id="workspaceCard" style="display: none;">
      <div class="input-group">
        <input type="text" id="scriptName" placeholder="Script Name (e.g. My Admin Hub)" />
      </div>

      <textarea id="sourceCode" placeholder="-- Paste your raw Luau script here..." spellcheck="false"></textarea>

      <button class="btn-build" id="buildBtn" onclick="buildCloudLoader()">Generate Obfuscated Link</button>

      <div class="output-box" id="resultBox">
        <span class="output-title">✓ Generated Loader Link:</span>
        <div class="link-field" id="loaderResult"></div>
        <button class="btn-copy-small" onclick="copyResultLink()">Copy Loader Link</button>
      </div>
    </main>

    <div class="card locked-notice" id="loginNotice">
      <h2>🔑 Login Required</h2>
      <p style="margin-top: 0.5rem;">Please log in with your Discord account to generate script loader links.</p>
    </div>

    <div class="card" id="vaultCard" style="display: none;">
      <h2 class="vault-title">📁 Your Saved Loader Links</h2>
      <div class="script-list" id="scriptVaultList">
        <p style="color: var(--text-sub);">No loader links saved yet.</p>
      </div>
    </div>
  </div>

  <script>
    let currentUser = null;
    let latestGeneratedLink = "";

    window.onload = async function() {
      await checkAuth();
    };

    async function checkAuth() {
      try {
        const res = await fetch('/api/me');
        const data = await res.json();

        if (data.authenticated) {
          currentUser = data.user;
          document.getElementById('authContainer').innerHTML = `
            <div class="user-profile">
              <img src="${data.user.avatar}" class="avatar" />
              <span class="username">${data.user.username}</span>
              <a href="/auth/logout" class="btn-logout">Logout</a>
            </div>
          `;
          document.getElementById('workspaceCard').style.display = 'flex';
          document.getElementById('vaultCard').style.display = 'flex';
          document.getElementById('loginNotice').style.display = 'none';

          loadUserScripts();
        } else {
          document.getElementById('workspaceCard').style.display = 'none';
          document.getElementById('vaultCard').style.display = 'none';
          document.getElementById('loginNotice').style.display = 'block';
        }
      } catch (err) {
        console.error("Auth check failed", err);
      }
    }

    async function buildCloudLoader() {
      const script = document.getElementById('sourceCode').value;
      const scriptName = document.getElementById('scriptName').value;
      const buildBtn = document.getElementById('buildBtn');

      if (!script.trim()) {
        alert("Please enter Luau source code first!");
        return;
      }

      buildBtn.disabled = true;
      buildBtn.innerText = "Generating Link...";

      try {
        const response = await fetch('/api/obfuscate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ script, scriptName })
        });

        const data = await response.json();

        if (data.success) {
          latestGeneratedLink = data.loader;
          document.getElementById('loaderResult').innerText = data.loader;
          document.getElementById('resultBox').style.display = 'flex';

          saveToLocalVault(data);
          document.getElementById('sourceCode').value = '';
          document.getElementById('scriptName').value = '';
          loadUserScripts();
        } else {
          alert("Error: " + (data.error || "Failed to generate loader link."));
        }
      } catch (err) {
        alert("Server error. Check console for details.");
        console.error(err);
      } finally {
        buildBtn.disabled = false;
        buildBtn.innerText = "Generate Obfuscated Link";
      }
    }

    function copyResultLink() {
      if (latestGeneratedLink) {
        navigator.clipboard.writeText(latestGeneratedLink);
        alert("Loader link copied to clipboard!");
      }
    }

    function saveToLocalVault(item) {
      if (!currentUser) return;
      const key = `sin_vault_${currentUser.id}`;
      const existing = JSON.parse(localStorage.getItem(key) || '[]');
      existing.unshift(item);
      localStorage.setItem(key, JSON.stringify(existing));
    }

    function loadUserScripts() {
      if (!currentUser) return;
      const key = `sin_vault_${currentUser.id}`;
      const scripts = JSON.parse(localStorage.getItem(key) || '[]');
      const container = document.getElementById('scriptVaultList');

      if (scripts.length > 0) {
        container.innerHTML = scripts.map(s => `
          <div class="script-item">
            <div class="script-header">
              <span class="script-name">${escapeHtml(s.name)}</span>
              <span class="script-date">${s.createdAt}</span>
            </div>
            <div class="link-field">${escapeHtml(s.loader)}</div>
            <button class="btn-copy-small" onclick="copyText('${escapeJs(s.loader)}')">Copy Link</button>
          </div>
        `).join('');
      } else {
        container.innerHTML = '<p style="color: var(--text-sub);">No loader links saved yet.</p>';
      }
    }

    function copyText(text) {
      navigator.clipboard.writeText(text);
      alert("Loader link copied!");
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function escapeJs(str) {
      return str.replace(/'/g, "\\'");
    }
  </script>

</body>
</html>
