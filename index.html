<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIN Obfuscator | Hardened Luau Protection</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #06060a;
            --bg-card: #0d0d14;
            --bg-card-border: rgba(255, 255, 255, 0.08);
            --accent-red: #ef4444;
            --accent-red-hover: #dc2626;
            --accent-glow: rgba(239, 68, 68, 0.25);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --font-code: 'Fira Code', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 3rem;
        }

        /* NAVBAR */
        header {
            width: 100%;
            max-width: 1100px;
            padding: 1.5rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--bg-card-border);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-weight: 700;
            font-size: 1.3rem;
            letter-spacing: -0.5px;
        }

        .brand-badge {
            background: var(--accent-red);
            color: white;
            font-size: 0.65rem;
            font-weight: 700;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .user-nav {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .auth-btn {
            background: #5865F2;
            color: white;
            text-decoration: none;
            padding: 0.55rem 1.1rem;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: opacity 0.2s;
        }

        .auth-btn:hover {
            opacity: 0.9;
        }

        .profile-card {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            background: var(--bg-card);
            border: 1px solid var(--bg-card-border);
            padding: 0.4rem 0.8rem;
            border-radius: 30px;
        }

        .profile-card img {
            width: 28px;
            height: 28px;
            border-radius: 50%;
        }

        .profile-card span {
            font-size: 0.85rem;
            font-weight: 600;
        }

        .logout-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.8rem;
            margin-left: 0.5rem;
        }

        .logout-link:hover {
            color: var(--accent-red);
        }

        /* MAIN CONTAINER */
        main {
            width: 100%;
            max-width: 1100px;
            padding: 2rem 1rem;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--bg-card-border);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        .card-header {
            margin-bottom: 1rem;
        }

        .card-header h2 {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .card-header p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 0.2rem;
        }

        /* FORM CONTROLS */
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-bottom: 1.2rem;
        }

        label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"], textarea {
            width: 100%;
            background: #040406;
            border: 1px solid var(--bg-card-border);
            border-radius: 8px;
            color: var(--text-main);
            padding: 0.75rem 1rem;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="text"]:focus, textarea:focus {
            border-color: var(--accent-red);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        textarea {
            font-family: var(--font-code);
            height: 280px;
            resize: vertical;
            line-height: 1.5;
        }

        .btn-primary {
            background: var(--accent-red);
            color: white;
            border: none;
            padding: 0.85rem 1.5rem;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            width: 100%;
        }

        .btn-primary:hover {
            background: var(--accent-red-hover);
        }

        .btn-primary:active {
            transform: scale(0.99);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* OUTPUT BOX */
        .output-box {
            display: none;
            margin-top: 1.5rem;
            background: #040406;
            border: 1px solid rgba(34, 197, 94, 0.3);
            border-radius: 8px;
            padding: 1rem;
        }

        .output-box.active {
            display: block;
        }

        .output-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .output-header span {
            font-size: 0.8rem;
            font-weight: 600;
            color: #22c55e;
        }

        .copy-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--bg-card-border);
            color: var(--text-main);
            padding: 0.3rem 0.7rem;
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
        }

        .copy-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .loader-code {
            font-family: var(--font-code);
            font-size: 0.8rem;
            color: #38bdf8;
            word-break: break-all;
        }

        /* VAULT GRID */
        .vault-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }

        .vault-card {
            background: #040406;
            border: 1px solid var(--bg-card-border);
            border-radius: 8px;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 0.8rem;
        }

        .vault-card-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .vault-card-date {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .vault-actions {
            display: flex;
            gap: 0.5rem;
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 0.35rem 0.6rem;
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
        }

        .btn-danger:hover {
            background: rgba(239, 68, 68, 0.3);
        }

        .empty-vault {
            color: var(--text-muted);
            font-size: 0.85rem;
            font-style: italic;
        }

        /* ERROR/ALERT NOTIFICATIONS */
        .alert {
            padding: 0.8rem 1rem;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 1rem;
            display: none;
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #f87171;
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <header>
        <div class="brand">
            <span>SIN</span>
            <span class="brand-badge">v5.0</span>
        </div>
        <div class="user-nav" id="userNav">
            <!-- Populated dynamically via JS -->
            <a href="/auth/discord" class="auth-btn">Login with Discord</a>
        </div>
    </header>

    <!-- MAIN DASHBOARD -->
    <main>

        <div id="alertBox" class="alert alert-error"></div>

        <!-- EDITOR CARD -->
        <section class="card">
            <div class="card-header">
                <h2>Luau Obfuscator Engine</h2>
                <p>Compile source Luau scripts into dynamic VM loader links.</p>
            </div>

            <div class="input-group">
                <label for="scriptName">Script Identifier / Title</label>
                <input type="text" id="scriptName" placeholder="e.g. Main_Hub_v1">
            </div>

            <div class="input-group">
                <label for="sourceCode">Luau Source Code</label>
                <textarea id="sourceCode" placeholder="-- Paste Luau script here...&#10;print('Hello World')"></textarea>
            </div>

            <button id="obfuscateBtn" class="btn-primary">Obfuscate Script</button>

            <div id="outputBox" class="output-box">
                <div class="output-header">
                    <span>✅ Script Encrypted Successfully!</span>
                    <button class="copy-btn" onclick="copyLoader()">Copy Loader Link</button>
                </div>
                <div class="loader-code" id="loaderOutput"></div>
            </div>
        </section>

        <!-- VAULT CARD -->
        <section class="card">
            <div class="card-header">
                <h2>Your Script Vault</h2>
                <p>Manage and copy active execution links hosted in server RAM.</p>
            </div>

            <div id="vaultGrid" class="vault-grid">
                <p class="empty-vault">Login to view your saved scripts.</p>
            </div>
        </section>

    </main>

    <!-- FRONTEND LOGIC -->
    <script>
        let currentUserId = null;

        // Initialize Session Check
        async function checkAuth() {
            try {
                const res = await fetch('/api/me');
                const data = await res.json();

                const userNav = document.getElementById('userNav');

                if (data.authenticated) {
                    currentUserId = data.user.id;
                    userNav.innerHTML = `
                        <div class="profile-card">
                            <img src="${data.user.avatar}" alt="Avatar">
                            <span>${data.user.username}</span>
                            <a href="/auth/logout" class="logout-link">Logout</a>
                        </div>
                    `;
                    loadVault();
                } else {
                    userNav.innerHTML = `<a href="/auth/discord" class="auth-btn">Login with Discord</a>`;
                    document.getElementById('vaultGrid').innerHTML = `<p class="empty-vault">Log in with Discord to access your script vault.</p>`;
                }
            } catch (err) {
                console.error("Auth status error:", err);
            }
        }

        // Show Alert Banner
        function showAlert(msg) {
            const box = document.getElementById('alertBox');
            box.innerText = msg;
            box.style.display = 'block';
            setTimeout(() => { box.style.display = 'none'; }, 5000);
        }

        // Obfuscate Action
        document.getElementById('obfuscateBtn').addEventListener('click', async () => {
            const script = document.getElementById('sourceCode').value;
            const scriptName = document.getElementById('scriptName').value;
            const btn = document.getElementById('obfuscateBtn');
            const outputBox = document.getElementById('outputBox');

            if (!script.trim()) {
                showAlert("Please enter Luau source code before obfuscating.");
                return;
            }

            btn.disabled = true;
            btn.innerText = "Encrypting & Building VM...";

            try {
                const res = await fetch('/api/obfuscate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ script, scriptName })
                });

                const data = await res.json();

                if (!res.ok || !data.success) {
                    throw new Error(data.error || "Obfuscation failed.");
                }

                document.getElementById('loaderOutput').innerText = data.loader;
                outputBox.classList.add('active');

                // Reload vault automatically
                if (currentUserId) loadVault();

            } catch (err) {
                showAlert(err.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "Obfuscate Script";
            }
        });

        // Copy Loader to Clipboard
        function copyLoader() {
            const text = document.getElementById('loaderOutput').innerText;
            navigator.clipboard.writeText(text);
            alert("Loader copied to clipboard!");
        }

        // Fetch User Vault
        async function loadVault() {
            try {
                const res = await fetch('/api/vault');
                const data = await res.json();

                const grid = document.getElementById('vaultGrid');

                if (!data.success || !data.scripts || data.scripts.length === 0) {
                    grid.innerHTML = `<p class="empty-vault">No scripts saved in vault yet.</p>`;
                    return;
                }

                grid.innerHTML = data.scripts.map(item => `
                    <div class="vault-card">
                        <div>
                            <div class="vault-card-title">${escapeHtml(item.name)}</div>
                            <div class="vault-card-date">Created ${item.createdAt}</div>
                        </div>
                        <div class="vault-actions">
                            <button class="copy-btn" onclick="navigator.clipboard.writeText('${escapeHtml(item.loader)}'); alert('Loader copied!');">Copy Link</button>
                            <button class="btn-danger" onclick="deleteScript('${item.id}')">Delete</button>
                        </div>
                    </div>
                `).join('');

            } catch (err) {
                console.error("Failed to load vault:", err);
            }
        }

        // Delete Script from Vault
        async function deleteScript(id) {
            if (!confirm("Are you sure you want to delete this script from RAM?")) return;

            try {
                const res = await fetch('/api/delete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id })
                });

                const data = await res.json();
                if (data.success) {
                    loadVault();
                } else {
                    showAlert(data.error || "Failed to delete script.");
                }
            } catch (err) {
                showAlert("Error deleting script.");
            }
        }

        // Utility: Escaping HTML strings
        function escapeHtml(str) {
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        // Run on load
        checkAuth();
    </script>
</body>
</html>
