<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIN Obfuscator | Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #060608;
      --card-bg: rgba(15, 15, 21, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-hover-border: rgba(239, 68, 68, 0.4);
      --accent: #ef4444;
      --accent-glow: rgba(239, 68, 68, 0.35);
      --accent-dark: #991b1b;
      --text: #f8fafc;
      --text-muted: #64748b;
      --text-sub: #94a3b8;
      --code-bg: #0a0a0f;
      --discord: #5865F2;
      --green: #10b981;
      --radius: 14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(239, 68, 68, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(88, 101, 242, 0.05) 0%, transparent 40%);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 2.5rem 1rem;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: #1f1f2e; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

    .container {
      width: 100%;
      max-width: 1000px;
      display: flex;
      flex-direction: column;
      gap: 1.75rem;
    }

    /* Navbar Header */
    .nav-header {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      padding: 1rem 1.75rem;
      border-radius: var(--radius);
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand-badge {
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
      color: #fff;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 800;
      font-size: 0.75rem;
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
      letter-spacing: 0.5px;
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .brand h1 {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .brand h1 span {
      color: var(--accent);
      text-shadow: 0 0 16px var(--accent-glow);
    }

    /* User Profile & Auth */
    .user-profile {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      background: rgba(255, 255, 255, 0.03);
      padding: 0.4rem 0.8rem 0.4rem 0.5rem;
      border-radius: 40px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 2px solid var(--accent);
    }

    .username {
      font-weight: 700;
      font-size: 0.9rem;
    }

    .btn-discord {
      background: var(--discord);
      color: #fff;
      padding: 0.65rem 1.25rem;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.88rem;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(88, 101, 242, 0.3);
    }

    .btn-discord:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(88, 101, 242, 0.45);
    }

    .btn-logout {
      background: rgba(239, 68, 68, 0.1);
      color: var(--accent);
      border: 1px solid rgba(239, 68, 68, 0.2);
      padding: 0.35rem 0.75rem;
      border-radius: 20px;
      text-decoration: none;
      font-size: 0.78rem;
      font-weight: 700;
      transition: all 0.2s;
    }

    .btn-logout:hover {
      background: var(--accent);
      color: #fff;
    }

    /* Glass Cards */
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 1.75rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-title {
      font-size: 1.15rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* Input & Textarea */
    .input-field {
      width: 100%;
      background: var(--code-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      color: #fff;
      padding: 0.85rem 1.1rem;
      font-size: 0.9rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-field:focus {
      border-color: var(--accent);
      box-shadow: 0 0 12px var(--accent-glow);
    }

    textarea.code-editor {
      width: 100%;
      height: 260px;
      background: var(--code-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      color: #f87171;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.88rem;
      padding: 1.1rem;
      resize: vertical;
      outline: none;
      line-height: 1.5;
      transition: border-color 0.2s;
    }

    textarea.code-editor:focus {
      border-color: var(--accent);
      box-shadow: 0 0 12px var(--accent-glow);
    }

    /* Primary Action Button */
    .btn-build {
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 800;
      padding: 0.95rem;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 4px 25px var(--accent-glow);
      transition: all 0.2s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-build:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 30px rgba(239, 68, 68, 0.55);
    }

    .btn-build:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    /* Loader Output Box */
    .output-box {
      display: none;
      flex-direction: column;
      gap: 0.75rem;
      background: rgba(16, 185, 129, 0.05);
      border: 1px solid rgba(16, 185, 129, 0.25);
      border-radius: 10px;
      padding: 1.1rem;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .output-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .output-title {
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--green);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .link-field {
      width: 100%;
      background: var(--code-bg);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 8px;
      color: #34d399;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      padding: 0.8rem 1rem;
      word-break: break-all;
      user-select: all;
    }

    /* Vault Items */
    .script-list {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .script-item {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 1.1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      transition: all 0.25s ease;
    }

    .script-item:hover {
      border-color: rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.035);
    }

    .script-item.deleting {
      opacity: 0;
      transform: scale(0.95);
    }

    .script-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .script-name {
      font-weight: 800;
      font-size: 0.95rem;
      color: var(--text);
    }

    .script-date {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
    }

    .action-row {
      display: flex;
      gap: 0.6rem;
    }

    .btn-action {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-sub);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 0.45rem 0.9rem;
      border-radius: 7px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-action:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
    }

    .btn-delete {
      background: rgba(239, 68, 68, 0.08);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.2);
    }

    .btn-delete:hover {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      box-shadow: 0 0 12px var(--accent-glow);
    }

    /* Locked state notice */
    .locked-notice {
      text-align: center;
      padding: 3rem 1.5rem;
      color: var(--text-sub);
    }

    /* Floating Toast Notification */
    #toastContainer {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      z-index: 9999;
    }

    .toast {
      background: #12121a;
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 0.85rem 1.2rem;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 600;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      gap: 0.6rem;
      animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .toast.success { border-color: rgba(16, 185, 129, 0.4); }
    .toast.danger { border-color: rgba(239, 68, 68, 0.4); }

    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Navbar Header -->
    <nav class="nav-header">
      <div class="brand">
        <span class="brand-badge">v4.0</span>
        <h1><span>SIN</span> Obfuscator</h1>
      </div>
      <div id="authContainer">
        <a href="/auth/discord" class="btn-discord">
          <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
          Login with Discord
        </a>
      </div>
    </nav>

    <!-- Obfuscator Workspace -->
    <main class="card" id="workspaceCard" style="display: none;">
      <div class="card-header">
        <h2 class="card-title">⚡ Script Obfuscator</h2>
      </div>

      <input type="text" id="scriptName" class="input-field" placeholder="Script Identifier / Title (e.g., Main Hub)" />

      <textarea id="sourceCode" class="code-editor" placeholder="-- Paste your raw Luau script here..." spellcheck="false"></textarea>

      <button class="btn-build" id="buildBtn" onclick="buildCloudLoader()">
        Generate Clean Loader Link
      </button>

      <div class="output-box" id="resultBox">
        <div class="output-header">
          <span class="output-title">✓ Active Loader Link</span>
          <button class="btn-action" onclick="copyResultLink()">Copy Link</button>
        </div>
        <div class="link-field" id="loaderResult"></div>
      </div>
    </main>

    <!-- Login Notice -->
    <div class="card locked-notice" id="loginNotice">
      <h2 style="font-size: 1.5rem; color: #fff; margin-bottom: 0.5rem;">🔒 Authentication Required</h2>
      <p>Log in with your Discord account to build and manage obfuscated script loaders.</p>
    </div>

    <!-- Script Vault -->
    <div class="card" id="vaultCard" style="display: none;">
      <div class="card-header">
        <h2 class="card-title">📁 Saved Script Vault</h2>
      </div>
      <div class="script-list" id="scriptVaultList">
        <p style="color: var(--text-muted); font-size: 0.9rem;">No loader links saved yet.</p>
      </div>
    </div>
  </div>

  <div id="toastContainer"></div>

  <script>
    let currentUser = null;
    let latestGeneratedLink = "";

    window.onload = async function() {
      await checkAuth();
    };

    function showToast(message, type = 'success') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.innerText = message;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateX(100%)';
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    async function checkAuth() {
      try {
        const res = await fetch('/api/me');
        const data = await res.json();

        if (data.authenticated) {
          currentUser = data.user;
          document.getElementById('authContainer').innerHTML = `
            <div class="user-profile">
              <img src="${data.user.avatar}" class="avatar" />
              <span class="username">${data.user.username}</span>
              <a href="/auth/logout" class="btn-logout">Logout</a>
            </div>
          `;
          document.getElementById('workspaceCard').style.display = 'flex';
          document.getElementById('vaultCard').style.display = 'flex';
          document.getElementById('loginNotice').style.display = 'none';

          loadUserScripts();
        } else {
          document.getElementById('workspaceCard').style.display = 'none';
          document.getElementById('vaultCard').style.display = 'none';
          document.getElementById('loginNotice').style.display = 'block';
        }
      } catch (err) {
        console.error("Auth check failed", err);
      }
    }

    async function buildCloudLoader() {
      const script = document.getElementById('sourceCode').value;
      const scriptName = document.getElementById('scriptName').value;
      const buildBtn = document.getElementById('buildBtn');

      if (!script.trim()) {
        showToast("Please input your Luau source code first!", "danger");
        return;
      }

      buildBtn.disabled = true;
      buildBtn.innerText = "Compiling & Generating...";

      try {
        const response = await fetch('/api/obfuscate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ script, scriptName })
        });

        const data = await response.json();

        if (data.success) {
          latestGeneratedLink = data.loader;
          document.getElementById('loaderResult').innerText = data.loader;
          document.getElementById('resultBox').style.display = 'flex';

          saveToLocalVault(data);
          document.getElementById('sourceCode').value = '';
          document.getElementById('scriptName').value = '';
          loadUserScripts();
          showToast("Generated new script loader!", "success");
        } else {
          showToast(data.error || "Failed to generate loader link.", "danger");
        }
      } catch (err) {
        showToast("Server error during compilation.", "danger");
      } finally {
        buildBtn.disabled = false;
        buildBtn.innerText = "Generate Clean Loader Link";
      }
    }

    function copyResultLink() {
      if (latestGeneratedLink) {
        navigator.clipboard.writeText(latestGeneratedLink);
        showToast("Loader link copied to clipboard!", "success");
      }
    }

    function saveToLocalVault(item) {
      if (!currentUser) return;
      const key = `sin_vault_${currentUser.id}`;
      const existing = JSON.parse(localStorage.getItem(key) || '[]');
      existing.unshift(item);
      localStorage.setItem(key, JSON.stringify(existing));
    }

    // Full Delete Script Implementation
    async function deleteScript(scriptId, elementId) {
      if (!currentUser) return;

      const cardElem = document.getElementById(elementId);
      if (cardElem) cardElem.classList.add('deleting');

      try {
        // Send delete request to server
        const response = await fetch('/api/delete', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: scriptId })
        });

        const data = await response.json();

        if (data.success) {
          showToast("Script destroyed from server & vault.", "danger");
        }
      } catch (e) {
        console.error("Server delete failed:", e);
      }

      // Remove from Local Storage Vault
      const key = `sin_vault_${currentUser.id}`;
      let existing = JSON.parse(localStorage.getItem(key) || '[]');
      existing = existing.filter(s => s.id !== scriptId);
      localStorage.setItem(key, JSON.stringify(existing));

      // Re-render UI list after animation
      setTimeout(() => {
        loadUserScripts();
      }, 250);
    }

    function loadUserScripts() {
      if (!currentUser) return;
      const key = `sin_vault_${currentUser.id}`;
      const scripts = JSON.parse(localStorage.getItem(key) || '[]');
      const container = document.getElementById('scriptVaultList');

      if (scripts.length > 0) {
        container.innerHTML = scripts.map((s, index) => {
          const elementId = `vault_item_${s.id}_${index}`;
          return `
            <div class="script-item" id="${elementId}">
              <div class="script-meta">
                <span class="script-name">${escapeHtml(s.name)}</span>
                <span class="script-date">${s.createdAt}</span>
              </div>
              <div class="link-field">${escapeHtml(s.loader)}</div>
              <div class="action-row">
                <button class="btn-action" onclick="copyText('${escapeJs(s.loader)}')">Copy Link</button>
                <button class="btn-action btn-delete" onclick="deleteScript('${s.id}', '${elementId}')">Delete</button>
              </div>
            </div>
          `;
        }).join('');
      } else {
        container.innerHTML = '<p style="color: var(--text-muted); font-size: 0.9rem;">No loader links saved yet.</p>';
      }
    }

    function copyText(text) {
      navigator.clipboard.writeText(text);
      showToast("Loader link copied to clipboard!", "success");
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function escapeJs(str) {
      return str.replace(/'/g, "\\'");
    }
  </script>
</body>
</html>
