<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error404 | Secure Luau Obfuscator & Host</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #030604;
            --bg-surface: rgba(10, 18, 12, 0.7);
            --bg-input: rgba(4, 10, 6, 0.85);
            --border-glow: rgba(0, 255, 128, 0.25);
            --border-hover: rgba(0, 255, 128, 0.6);
            --accent-green: #00ff80;
            --accent-cyan: #00f0ff;
            --accent-glow: rgba(0, 255, 128, 0.4);
            --text-primary: #ecfdf5;
            --text-secondary: #6ee7b7;
            --text-dim: #34d39988;
            --danger: #ff3366;
            --danger-glow: rgba(255, 51, 102, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Fira Code', monospace;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient Glow & Grid Backdrop */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: 
                radial-gradient(circle at 20% 10%, rgba(0, 255, 128, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 80% 90%, rgba(0, 240, 255, 0.05) 0%, transparent 40%),
                linear-gradient(rgba(0, 255, 128, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 128, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 40px 40px, 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        /* Scanline Overlay */
        body::after {
            content: "";
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 999;
            opacity: 0.6;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 48px;
            border-bottom: 1px solid var(--border-glow);
            background: rgba(3, 6, 4, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.8);
        }

        .logo {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 1.5rem;
            font-weight: 800;
            color: #fff;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-highlight {
            color: var(--accent-green);
            text-shadow: 0 0 15px var(--accent-glow);
        }

        .logo-badge {
            font-family: 'Fira Code', monospace;
            font-size: 0.65rem;
            color: var(--accent-green);
            background: rgba(0, 255, 128, 0.1);
            border: 1px solid var(--accent-green);
            padding: 4px 10px;
            border-radius: 20px;
            letter-spacing: 1px;
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .user-widget {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .discord-btn {
            background: linear-gradient(135deg, #5865F2 0%, #3b42cc 100%);
            color: #fff;
            padding: 10px 22px;
            border-radius: 8px;
            text-decoration: none;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 700;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 0 20px rgba(88, 101, 242, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .discord-btn:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 0 30px rgba(88, 101, 242, 0.6);
            filter: brightness(1.15);
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--bg-surface);
            border: 1px solid var(--border-glow);
            padding: 6px 18px;
            border-radius: 40px;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
        }

        .user-profile img {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 2px solid var(--accent-green);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .logout-btn {
            color: var(--danger);
            text-decoration: none;
            font-size: 0.75rem;
            font-weight: 700;
            margin-left: 6px;
            transition: opacity 0.2s, text-shadow 0.2s;
        }

        .logout-btn:hover {
            text-shadow: 0 0 8px var(--danger-glow);
        }

        main {
            flex: 1;
            max-width: 1320px;
            width: 100%;
            margin: 0 auto;
            padding: 40px 24px;
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 32px;
            position: relative;
            z-index: 1;
        }

        @media(max-width: 960px) {
            main {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--bg-surface);
            border: 1px solid var(--border-glow);
            border-radius: 16px;
            padding: 32px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            border-color: var(--border-hover);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 20px rgba(0, 255, 128, 0.1);
        }

        h2 {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 1rem;
            font-weight: 800;
            color: var(--accent-green);
            margin-bottom: 24px;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 10px;
            text-shadow: 0 0 10px var(--accent-glow);
        }

        .editor-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            letter-spacing: 1px;
            font-weight: 600;
            text-transform: uppercase;
        }

        input[type="text"], select {
            background: var(--bg-input);
            border: 1px solid var(--border-glow);
            color: var(--text-primary);
            padding: 14px 18px;
            border-radius: 10px;
            outline: none;
            font-size: 0.88rem;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        input[type="text"]:focus, select:focus {
            border-color: var(--accent-green);
            box-shadow: 0 0 20px var(--accent-glow);
            background: rgba(4, 12, 7, 0.95);
        }

        textarea {
            background: var(--bg-input);
            border: 1px solid var(--border-glow);
            color: #00ffaa;
            padding: 18px;
            border-radius: 10px;
            min-height: 340px;
            resize: vertical;
            outline: none;
            font-size: 0.88rem;
            line-height: 1.6;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.8);
        }

        textarea:focus {
            border-color: var(--accent-green);
            box-shadow: 0 0 25px var(--accent-glow), inset 0 2px 10px rgba(0, 0, 0, 0.8);
            background: rgba(4, 12, 7, 0.95);
        }

        .action-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #00ff80 0%, #00b359 100%);
            color: #020603;
            border: none;
            padding: 14px 32px;
            border-radius: 10px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 800;
            font-size: 0.88rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 0 25px var(--accent-glow);
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .btn-primary:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 0 35px rgba(0, 255, 128, 0.7);
            filter: brightness(1.1);
        }

        .btn-primary:active {
            transform: translateY(0) scale(0.98);
        }

        .output-box {
            margin-top: 12px;
            background: rgba(2, 6, 3, 0.95);
            border: 1px solid var(--border-glow);
            padding: 20px;
            border-radius: 12px;
            display: none;
            animation: slideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .output-box.active {
            display: block;
        }

        .loader-link {
            color: transparent;
            background-color: #020503;
            text-shadow: 0 0 12px rgba(0, 255, 128, 0.3);
            user-select: none;
            cursor: pointer;
            word-break: break-all;
            font-size: 0.82rem;
            margin: 12px 0;
            padding: 14px;
            border: 1px dashed var(--border-glow);
            border-radius: 8px;
            display: block;
            transition: all 0.25s ease;
        }

        .loader-link:hover, .loader-link.revealed {
            color: var(--accent-green);
            background-color: rgba(0, 255, 128, 0.05);
            text-shadow: none;
            user-select: text;
            border-style: solid;
            border-color: var(--accent-green);
            box-shadow: 0 0 15px rgba(0, 255, 128, 0.15);
        }

        .vault-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
            max-height: 580px;
            overflow-y: auto;
            padding-right: 6px;
        }

        .vault-list::-webkit-scrollbar {
            width: 5px;
        }
        .vault-list::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 4px;
        }
        .vault-list::-webkit-scrollbar-thumb {
            background: var(--border-glow);
            border-radius: 4px;
        }
        .vault-list::-webkit-scrollbar-thumb:hover {
            background: var(--accent-green);
        }

        .vault-item {
            background: rgba(2, 6, 3, 0.8);
            border: 1px solid var(--border-glow);
            padding: 16px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .vault-item:hover {
            border-color: var(--accent-green);
            transform: translateX(4px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5), 0 0 15px rgba(0, 255, 128, 0.15);
        }

        .vault-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .vault-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            overflow: hidden;
        }

        .vault-name {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 700;
            font-size: 0.9rem;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .vault-date {
            font-size: 0.72rem;
            color: var(--text-dim);
        }

        .vault-actions {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            background: rgba(0, 255, 128, 0.06);
            border: 1px solid var(--border-glow);
            color: var(--text-primary);
            padding: 7px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.78rem;
            font-weight: 600;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .icon-btn:hover {
            background: var(--accent-green);
            color: #020603;
            border-color: var(--accent-green);
            box-shadow: 0 0 15px var(--accent-glow);
            transform: translateY(-1px);
        }

        .icon-btn.delete {
            background: rgba(255, 51, 102, 0.06);
            border-color: rgba(255, 51, 102, 0.25);
            color: var(--danger);
        }

        .icon-btn.delete:hover {
            background: var(--danger);
            color: #ffffff;
            border-color: var(--danger);
            box-shadow: 0 0 15px var(--danger-glow);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            ERROR<span class="logo-highlight">404</span> 
            <span class="logo-badge">OBFUSCATOR</span>
        </div>
        <div class="user-widget" id="userWidget">
            <!-- Dynamically populated via auth API -->
        </div>
    </header>

    <main>
        <!-- Editor / Deploy Section -->
        <div class="card">
            <h2>// SCRIPT DEPLOYMENT ENGINE</h2>
            <div class="editor-container">
                <input type="hidden" id="editId" value="">
                <div class="input-group">
                    <label>SCRIPT NAME</label>
                    <input type="text" id="scriptName" placeholder="e.g. Universal Aimbot / UI Library">
                </div>
                <div class="input-group">
                    <label>LANGUAGE ENVIRONMENT</label>
                    <select id="fileType">
                        <option value="luau">Luau (Roblox Optimized)</option>
                        <option value="lua">Lua 5.1 / Standard</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>SOURCE CODE & UI LIBRARIES</label>
                    <textarea id="scriptInput" placeholder="Paste your script, Rayfield, or Orion UI library code here..."></textarea>
                </div>
                <div class="action-row">
                    <span id="statusMsg" style="font-size: 0.8rem; color: var(--accent-green);"></span>
                    <button class="btn-primary" onclick="deployScript()">Obfuscate & Host</button>
                </div>

                <div class="output-box" id="outputBox">
                    <label>GENERATED LOADSTRING (Click to Reveal):</label>
                    <code class="loader-link" id="loaderOutput" onclick="toggleReveal(this)" title="Click to reveal"></code>
                    <div style="margin-top: 10px; display: flex; gap: 10px;">
                        <button class="icon-btn" onclick="copyLoader()">Copy Loadstring</button>
                        <button class="icon-btn" onclick="toggleRevealManual()">Toggle Visibility</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Script Vault Section -->
        <div class="card">
            <h2>// SCRIPT VAULT (OWNER ONLY)</h2>
            <div class="vault-list" id="vaultList">
                <div style="color: var(--text-dim); font-size: 0.85rem; text-align: center; padding: 20px;">
                    Sign in with Discord to view your deployed scripts.
                </div>
            </div>
        </div>
    </main>

    <script>
        // Check user session on load
        async function checkUser() {
            try {
                const res = await fetch('/api/me');
                const data = await res.json();
                const widget = document.getElementById('userWidget');
                if (data.authenticated) {
                    widget.innerHTML = `
                        <div class="user-profile">
                            <img src="${data.user.avatar}" alt="Avatar">
                            <span style="font-size: 0.85rem; font-weight: 600;">${data.user.username}</span>
                            <a href="/auth/logout" class="logout-btn">[LOGOUT]</a>
                        </div>
                    `;
                    loadVault();
                } else {
                    widget.innerHTML = `
                        <a href="/auth/discord" class="discord-btn">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.011c3.927 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
                            Login with Discord
                        </a>
                    `;
                }
            } catch (e) {
                console.error("Auth check failed", e);
            }
        }

        // Safe Base64 encoding supporting all UTF-8 characters
        function safeBase64Encode(str) {
            const bytes = new TextEncoder().encode(str);
            let binString = "";
            for (let i = 0; i < bytes.length; i++) {
                binString += String.fromCharCode(bytes[i]);
            }
            return btoa(binString);
        }

        async function deployScript() {
            const scriptName = document.getElementById('scriptName').value;
            const fileType = document.getElementById('fileType').value;
            const scriptInput = document.getElementById('scriptInput').value;
            const editId = document.getElementById('editId').value;
            const statusMsg = document.getElementById('statusMsg');

            if (!scriptInput.trim()) {
                statusMsg.style.color = 'var(--danger)';
                statusMsg.innerText = 'Error: Script input is empty.';
                return;
            }

            statusMsg.style.color = 'var(--accent-green)';
            statusMsg.innerText = 'Obfuscating and deploying...';

            try {
                const payload = safeBase64Encode(scriptInput);
                const res = await fetch('/api/obfuscate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ scriptPayload: payload, scriptName, fileType, editId })
                });

                const data = await res.json();
                if (data.success) {
                    statusMsg.innerText = 'Successfully obfuscated & hosted!';
                    document.getElementById('outputBox').classList.add('active');
                    document.getElementById('loaderOutput').innerText = data.loader;
                    document.getElementById('editId').value = '';
                    loadVault();
                } else {
                    statusMsg.style.color = 'var(--danger)';
                    statusMsg.innerText = 'Error: ' + data.error;
                }
            } catch (err) {
                statusMsg.style.color = 'var(--danger)';
                statusMsg.innerText = 'Network error during deployment.';
            }
        }

        async function loadVault() {
            try {
                const res = await fetch('/api/vault');
                const data = await res.json();
                const vaultList = document.getElementById('vaultList');
                
                if (!data.success || data.scripts.length === 0) {
                    vaultList.innerHTML = `<div style="color: var(--text-dim); font-size: 0.85rem; text-align: center; padding: 20px;">No deployed scripts in vault.</div>`;
                    return;
                }

                vaultList.innerHTML = data.scripts.map(s => `
                    <div class="vault-item">
                        <div class="vault-header">
                            <div class="vault-info">
                                <span class="vault-name">${s.name}</span>
                                <span class="vault-date">${s.fileType.toUpperCase()} • ${s.createdAt}</span>
                            </div>
                            <div class="vault-actions">
                                <button class="icon-btn" onclick="copyVaultLoader(this)">Copy</button>
                                <button class="icon-btn" onclick="editScript('${s.id}', '${s.name}', '${s.fileType}', ` + encodeURIComponent(JSON.stringify(s.code)) + `)">Edit</button>
                                <button class="icon-btn delete" onclick="deleteScript('${s.id}')">Del</button>
                            </div>
                        </div>
                        <div>
                            <label style="font-size: 0.7rem; color: var(--text-dim);">LOADSTRING (Click to Reveal):</label>
                            <code class="loader-link" onclick="toggleReveal(this)">${s.loader}</code>
                        </div>
                    </div>
                `).join('');
            } catch (e) {
                console.error("Failed to load vault", e);
            }
        }

        function editScript(id, name, fileType, code) {
            document.getElementById('editId').value = id;
            document.getElementById('scriptName').value = name;
            document.getElementById('fileType').value = fileType;
            document.getElementById('scriptInput').value = decodeURIComponent(code);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function deleteScript(id) {
            if (!confirm('Are you sure you want to delete this script?')) return;
            await fetch('/api/delete', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id })
            });
            loadVault();
        }

        function copyLoader() {
            const text = document.getElementById('loaderOutput').innerText;
            navigator.clipboard.writeText(text);
            alert('Loadstring copied to clipboard!');
        }

        function copyVaultLoader(btn) {
            const codeEl = btn.closest('.vault-item').querySelector('.loader-link');
            navigator.clipboard.writeText(codeEl.innerText);
            alert('Loadstring copied to clipboard!');
        }

        function toggleReveal(element) {
            element.classList.toggle('revealed');
        }

        function toggleRevealManual() {
            const output = document.getElementById('loaderOutput');
            output.classList.toggle('revealed');
        }

        checkUser();
    </script>
</body>
</html>
